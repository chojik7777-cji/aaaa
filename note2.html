<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공동메모장</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:16px;font-family:'Segoe UI','Apple SD Gothic Neo','맑은 고딕',sans-serif;background:linear-gradient(135deg,#e0eafc,#cfdef3);color:#1a202c}.wrap{max-width:1000px;margin:0 auto;background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 22px 70px rgba(0,0,0,.3);overflow:hidden}header{padding:20px 22px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}h1{margin:0 0 6px;font-size:26px;color:#1a365d}.sub{margin:0;color:#4a5568;line-height:1.5;font-size:14px}.panel{padding:18px 22px}.top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end;margin-bottom:12px}label{display:block;font-size:13px;font-weight:800;color:#4a5568;margin-bottom:5px}input,textarea,button{font:inherit}input[type=text]{width:100%;border:1px solid #cbd5e0;border-radius:12px;padding:10px 12px}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#2b6cb0;color:white}button.secondary{background:#edf2f7;color:#2d3748;border:1px solid #cbd5e0}button.danger{background:#c53030}button:disabled{opacity:.55;cursor:wait}.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#4a5568;font-size:13px;margin:8px 0 12px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-weight:800}.ok{background:#c6f6d5;color:#22543d}.warn{background:#fefcbf;color:#744210}.bad{background:#fed7d7;color:#742a2a}textarea{width:100%;min-height:52vh;resize:vertical;border:1px solid #cbd5e0;border-radius:16px;padding:16px;line-height:1.7;font-size:16px;outline:none}textarea:focus,input:focus{border-color:#2b6cb0;box-shadow:0 0 0 3px rgba(43,108,176,.16)}.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}.files{border-top:1px solid #e2e8f0;background:#f8fafc}.upload{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}.file-list{display:grid;gap:8px}.file{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.file b{color:#2d3748}.file small{color:#718096}.file-actions{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:12px;color:#718096;line-height:1.6}.copy{word-break:break-all;color:#2b6cb0;font-size:13px}.setup{display:none;margin:12px 0;padding:14px;border-radius:14px;background:#fff5f5;border:1px solid #feb2b2;color:#742a2a}.setup pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#1a202c;color:#e2e8f0;padding:12px;border-radius:10px;font-size:12px}.lock{position:fixed;inset:0;background:rgba(26,32,44,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.lock[hidden]{display:none}.lock form{background:white;border-radius:20px;padding:24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.lock h2{margin:0 0 6px;color:#1a365d}.lock input{width:100%;border:1px solid #cbd5e0;border-radius:12px;padding:12px;font-size:18px;margin:10px 0}.lock button{width:100%}.lock .err{color:#c53030;font-size:13px;min-height:18px;margin:8px 0 0}@media(max-width:720px){.top{grid-template-columns:1fr}textarea{min-height:46vh}header,.panel{padding:16px}}
    .file .fname { color:#2b6cb0; font-weight:800; text-align:left; cursor:pointer; text-decoration:underline; text-underline-offset:3px; word-break:break-all; }
    .file .kind { font-size:18px; margin-right:4px; }
    .hover-pv { position:fixed; z-index:20; pointer-events:none; background:white; padding:6px; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    .hover-pv img { display:block; max-width:280px; max-height:240px; border-radius:8px; }
    .footer { text-align:center; margin:18px 0 6px; color:#4a5568; font-size:14px; }
    .footer a { color:#2b6cb0; font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><h1>📝 공동메모장</h1></div><button class="secondary" id="copyLinkBtn" type="button">공유 링크 복사</button></header>
    <section class="panel">
      <div class="setup" id="setupBox"><b>Supabase 설정 필요</b><p id="setupMsg"></p><pre id="setupSql"></pre></div>
      <div class="top"><div><label for="userName">내 이름</label><input id="userName" type="text" maxlength="30" placeholder="예: 정익" autocomplete="name"></div><button id="saveBtn" type="button">지금 저장</button><button class="secondary" id="reloadBtn" type="button">새로고침</button></div>
      <div class="copy" id="shareUrl"></div><div class="status"><span id="liveBadge" class="badge warn">● 연결 준비</span><span id="versionText">버전 -</span><span id="updatedText">아직 저장 전</span></div>
      <textarea id="editor" placeholder="여기에 함께 수정할 텍스트를 입력하세요."></textarea>
      <div class="bar"><div class="hint">입력 후 약 1초 뒤 자동 저장, 다른 사람의 변경은 약 1.5초마다 반영됩니다.</div><div class="hint" id="countText">0자</div></div>
    </section>
    <section class="panel files"><h2>첨부파일</h2><div class="upload"><input id="fileInput" type="file"><button id="uploadBtn" type="button">업로드</button></div><p class="hint" id="storageText">☁️ Supabase 저장소 · 파일당 8MB까지</p><div class="file-list" id="fileList"></div></section>
  </main>
  <div class="lock" id="lock" hidden><form id="lockForm"><h2>🔒 비밀번호</h2><p class="hint">공유노트 비밀번호를 입력하세요.</p><input id="lockPw" type="password" autocomplete="current-password" aria-label="비밀번호"><button type="submit" id="lockBtn">들어가기</button><p class="err" id="lockErr"></p></form></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const params=new URLSearchParams(location.search); const room=(params.get('room')||'default').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,50)||'default'; if(!params.get('room')){params.set('room',room); history.replaceState(null,'',`${location.pathname}?${params.toString()}`)}
const API='/api/note2'; let state={version:-1,text:'',files:[]}; let dirty=false,saving=false,saveTimer=null,applyingRemote=false,lastLocalEdit=0,locked=false;
const TOKEN_KEY='note2-token'; function token(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}
function showLock(msg){locked=true;$('lock').hidden=false;if(msg)$('lockErr').textContent=msg;setBadge('bad','● 비밀번호 필요');setTimeout(()=>$('lockPw').focus(),50)}
function user(){const v=$('userName').value.trim(); try{localStorage.setItem('note-user-name',v)}catch(e){} return v||'익명'}
function fmtTime(ts){return ts?new Date(ts).toLocaleString('ko-KR',{hour12:false}):'-'} function fmtSize(n){return n<1024?`${n}B`:n<1048576?`${(n/1024).toFixed(1)}KB`:`${(n/1048576).toFixed(1)}MB`} function setBadge(k,t){$('liveBadge').className=`badge ${k}`;$('liveBadge').textContent=t} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,body){const res=await fetch(`${API}/${action}?room=${encodeURIComponent(room)}`,{method:action==='state'?'GET':'POST',headers:{'Content-Type':'application/json','X-Note-Token':token()},body:action==='state'?undefined:JSON.stringify({room,...(body||{})}),cache:'no-store'}); const data=await res.json(); if(res.status===401&&data.authRequired&&action!=='login'){showLock();throw new Error(data.error)} if(!res.ok||!data.ok){ if(data.setupRequired) showSetup(data); throw new Error(data.error||'서버 오류') } return data}
function showSetup(data){$('setupBox').style.display='block';$('setupMsg').textContent=`Vercel 환경변수 ${data.requiredEnv?.join(', ')} 설정과 Supabase 테이블/버킷 생성이 필요합니다.`;$('setupSql').textContent=data.sql||'';setBadge('bad','● Supabase 설정 필요')}
function updateStatus(d){$('versionText').textContent=`버전 ${d.version??'-'}`;$('updatedText').textContent=d.updatedAt?`마지막 수정: ${fmtTime(d.updatedAt)} · ${d.updatedBy||'익명'}`:'아직 저장 전';$('countText').textContent=`${$('editor').value.length.toLocaleString()}자`}
function applyRemote(d,force=false){$('setupBox').style.display='none';const remoteNewer=d.version>state.version;state=d;$('storageText').textContent=d.storage==='folder'?`💾 파일당 ${fmtSize(d.maxFileBytes)}까지`:'☁️ Supabase 저장소 · 파일당 8MB까지';renderFiles(d.files||[]);updateStatus(d);if(force||(!dirty&&remoteNewer)){applyingRemote=true;$('editor').value=d.text||'';applyingRemote=false;dirty=false;setBadge('ok','● 동기화됨')}else if(dirty&&remoteNewer&&Date.now()-lastLocalEdit>1800){setBadge('warn','● 다른 수정 있음 · 저장하면 내 내용으로 덮어씀')}}
async function load(force=false){if(locked)return;try{applyRemote(await api('state'),force)}catch(e){if(!$('setupBox').style.display)setBadge('bad','● 연결 오류');console.warn(e)}}
async function saveNow(){if(saving)return;try{saving=true;$('saveBtn').disabled=true;setBadge('warn','● 저장 중');const d=await api('save',{text:$('editor').value,user:user()});dirty=false;applyRemote(d,true)}catch(e){setBadge('bad',`● 저장 실패: ${e.message}`)}finally{saving=false;$('saveBtn').disabled=false}}
function scheduleSave(){dirty=true;lastLocalEdit=Date.now();setBadge('warn','● 저장 대기');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1000)}
function renderFiles(files) {
  pvFiles = files;
  const box = $('fileList');
  // 목록이 바뀌었을 때만 다시 그리기 (1.5초마다 그리면 미리보기가 깜빡여요)
  const sig = JSON.stringify([token(), files.map((f) => [f.id, f.size, f.uploadedAt, f.uploadedBy])]);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  if (!files.length) { box.innerHTML = '<div class="hint">아직 첨부파일이 없습니다.</div>'; return; }
  box.innerHTML = files.map((f) => {
    const kind = pvKind(f);
    const name = kind
      ? `<a class="fname" href="${fileUrl(f, true)}" target="_blank" rel="noopener" data-preview="${esc(f.id)}" title="새 탭에서 열기"><span class="kind">${PV_ICON[kind]}</span>${esc(f.name)}</a>`
      : `<b>${esc(f.name)}</b>`;
    return `
    <div class="file">
      <div>${name}<br><small>${fmtSize(f.size)} · ${fmtTime(f.uploadedAt)} · ${esc(f.uploadedBy || '익명')}</small></div>
      <div class="file-actions">
        ${kind ? `<a href="${fileUrl(f, true)}" target="_blank" rel="noopener"><button type="button" class="secondary">👁 새 탭에서 보기</button></a>` : ''}
        <a href="${fileUrl(f, false)}" download="${esc(f.name)}"><button type="button" class="secondary">다운로드</button></a>
        <button type="button" class="danger" data-delete="${esc(f.id)}">삭제</button>
      </div>
    </div>`;
  }).join('');
}
async function uploadFile(){const file=$('fileInput').files[0]; if(!file)return alert('업로드할 파일을 선택하세요.'); const max=state.maxFileBytes||8000000;if(file.size>max)return alert(`${fmtSize(max)} 이하 파일만 업로드할 수 있습니다.`); $('uploadBtn').disabled=true;try{const dataUrl=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=bad;r.readAsDataURL(file)});applyRemote(await api('upload',{name:file.name,type:file.type||'application/octet-stream',dataUrl,user:user()}),false);$('fileInput').value=''}catch(e){alert(e.message)}finally{$('uploadBtn').disabled=false}}
async function deleteFile(id){if(!confirm('첨부파일을 삭제할까요?'))return;try{applyRemote(await api('delete-file',{id,user:user()}),false)}catch(e){alert(e.message)}}
// ===== 첨부파일 미리보기 =====
// 사진: 마우스를 올리면 작은 미리보기 / 사진·PDF·영상·음악·텍스트: 이름을 클릭·터치하면 새 탭에서 열기
const PV_EXT = { image: /\.(jpe?g|png|gif|webp|bmp|heic)$/i, pdf: /\.pdf$/i, video: /\.(mp4|webm|mov)$/i, audio: /\.(mp3|m4a|wav|ogg|aac)$/i, text: /\.(txt|md|csv|log)$/i };
const PV_ICON = { image: '🖼️', pdf: '📕', video: '🎬', audio: '🎵', text: '📄' };
function pvKind(f) {
  const t = String(f.type || '').toLowerCase();
  for (const [k, re] of Object.entries(PV_EXT)) if (re.test(f.name || '')) return k;
  if (t.startsWith('image/') && !t.includes('svg')) return 'image';
  if (t === 'application/pdf') return 'pdf';
  if (t.startsWith('video/')) return 'video';
  if (t.startsWith('audio/')) return 'audio';
  if (t.startsWith('text/plain')) return 'text';
  return '';
}
function fileUrl(f, inline) {
  const tk = token();
  return `${API}/file?room=${encodeURIComponent(room)}&id=${encodeURIComponent(f.id)}${tk ? `&token=${encodeURIComponent(tk)}` : ''}${inline ? '&inline=1' : ''}`;
}
let pvFiles = [];
const hoverPv = document.createElement('div'); hoverPv.className = 'hover-pv'; hoverPv.hidden = true; document.body.appendChild(hoverPv);
const canHover = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
function hideHover() { hoverPv.hidden = true; hoverPv.innerHTML = ''; }
let lastHoverEvt = null;
function placeHover(e) {
  lastHoverEvt = e;
  const w = hoverPv.offsetWidth || 290, h = hoverPv.offsetHeight || 250;
  let x = e.clientX + 18, y = e.clientY + 18;
  if (x + w > innerWidth - 8) x = e.clientX - w - 18;
  if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
  hoverPv.style.left = `${Math.max(8, x)}px`; hoverPv.style.top = `${y}px`;
}
if (canHover) {
  $('fileList').addEventListener('mouseover', (e) => {
    const b = e.target.closest('[data-preview]'); if (!b) return;
    const f = pvFiles.find((x) => x.id === b.dataset.preview);
    if (!f || pvKind(f) !== 'image') return;
    if (hoverPv.dataset.id !== f.id || hoverPv.hidden) {
      hoverPv.dataset.id = f.id;
      hoverPv.innerHTML = `<img alt="" src="${fileUrl(f, true)}">`;
      hoverPv.querySelector('img').onerror = hideHover;
      hoverPv.querySelector('img').onload = () => { if (lastHoverEvt) placeHover(lastHoverEvt); };
      hoverPv.hidden = false;
    }
    placeHover(e);
  });
  $('fileList').addEventListener('mousemove', (e) => { if (!hoverPv.hidden) placeHover(e); });
  $('fileList').addEventListener('mouseout', (e) => { const b = e.target.closest('[data-preview]'); if (b && !b.contains(e.relatedTarget)) hideHover(); });
}
$('lockForm').addEventListener('submit',async e=>{e.preventDefault();$('lockBtn').disabled=true;$('lockErr').textContent='';try{const d=await api('login',{password:$('lockPw').value});try{localStorage.setItem(TOKEN_KEY,d.token||'')}catch(err){}locked=false;$('lock').hidden=true;$('lockPw').value='';load(true)}catch(err){$('lockErr').textContent=err.message;$('lockPw').select()}finally{$('lockBtn').disabled=false}});
$('editor').addEventListener('input',()=>{if(!applyingRemote)scheduleSave();$('countText').textContent=`${$('editor').value.length.toLocaleString()}자`});$('saveBtn').addEventListener('click',saveNow);$('reloadBtn').addEventListener('click',()=>load(true));$('uploadBtn').addEventListener('click',uploadFile);$('fileList').addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(b)deleteFile(b.dataset.delete)});$('copyLinkBtn').addEventListener('click',async()=>{const url=`${location.origin}${location.pathname}?room=${encodeURIComponent(room)}`;try{await navigator.clipboard.writeText(url);alert('공유 링크를 복사했습니다.')}catch(e){prompt('공유 링크를 복사하세요.',url)}});try{$('userName').value=localStorage.getItem('note-user-name')||''}catch(e){}$('shareUrl').textContent=`공유 URL: ${location.origin}${location.pathname}?room=${room}`;load(true);setInterval(()=>load(false),1500);
</script>
    <p class="footer">문의 : <a href="mailto:chojeongik@naver.com">chojeongik@naver.com</a></p>
</body>
</html>
