<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오목 접속자 현황</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:20px; font-family:'Segoe UI','Apple SD Gothic Neo','맑은 고딕',sans-serif; background:linear-gradient(135deg,#232526 0%,#414345 100%); color:#172033; }
    .wrap { max-width:1100px; margin:0 auto; }
    header { background:rgba(255,255,255,.94); border-radius:22px; padding:24px; box-shadow:0 18px 50px rgba(0,0,0,.22); margin-bottom:18px; }
    h1 { margin:0 0 8px; font-size:30px; color:#1a365d; } .sub { margin:0; color:#4a5568; line-height:1.6; }
    .topline { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; } .links { display:flex; gap:8px; flex-wrap:wrap; }
    a.btn, button { border:0; border-radius:12px; padding:10px 14px; background:#edf2ff; color:#2b4c9a; text-decoration:none; font-weight:700; cursor:pointer; } button { background:#2b6cb0; color:white; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)); gap:12px; margin:18px 0; } .stat,.room { background:rgba(255,255,255,.95); border-radius:18px; padding:16px; box-shadow:0 12px 32px rgba(0,0,0,.18); }
    .stat b { display:block; font-size:28px; color:#2b6cb0; margin-bottom:3px; } .stat span { color:#718096; font-size:13px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; color:white; margin:12px 2px; }
    .badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 10px; font-size:13px; font-weight:800; } .live { background:#c6f6d5; color:#22543d; } .stale { background:#fed7d7; color:#742a2a; }
    .rooms { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; } .room h2 { margin:0 0 10px; font-size:22px; color:#1a365d; display:flex; justify-content:space-between; gap:8px; }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:1px; } .phase { color:#2b6cb0; font-size:14px; font-weight:800; }
    .teams { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; } .team { border-radius:14px; padding:12px; border:2px solid #e2e8f0; background:#f8fafc; } .team.current { border-color:#f6ad55; box-shadow:0 0 0 3px rgba(246,173,85,.18); }
    .black .team-name { color:#111; } .white .team-name { color:#4a5568; } .team-name { font-weight:900; font-size:17px; margin-bottom:6px; } .team-count { font-size:26px; font-weight:900; } .pieces { font-size:13px; color:#4a5568; line-height:1.6; margin-top:6px; }
    .meta { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; } .meta div { background:#edf2f7; border-radius:12px; padding:9px; font-size:13px; }
    .log { margin:12px 0 0; padding:0; list-style:none; color:#4a5568; font-size:13px; } .log li { border-top:1px solid #edf2f7; padding:6px 0; } .empty { background:rgba(255,255,255,.95); border-radius:18px; padding:28px; text-align:center; color:#4a5568; } .error { background:#fed7d7; color:#742a2a; border-radius:14px; padding:14px; margin:12px 0; display:none; }
    @media (max-width:720px) { body{padding:12px} h1{font-size:24px} .stats{grid-template-columns:repeat(2,1fr)} .teams,.meta{grid-template-columns:1fr} }
  </style>
</head>
<body><div class="wrap"><header><div class="topline"><div><h1>⚫ 오목 접속자 현황</h1><p class="sub">방별 접속자, 현재 차례, 진행 상태를 실시간으로 확인합니다.</p></div><div class="links"><a class="btn" href="omok.html">게임으로 이동</a><a class="btn" href="index.html">자기소개</a><button id="refreshBtn" type="button">새로고침</button></div></div><div class="stats"><div class="stat"><b id="roomCount">0</b><span>전체 방</span></div><div class="stat"><b id="activeCount">0</b><span>진행/대기 방</span></div><div class="stat"><b id="memberCount">0</b><span>플레이어</span></div><div class="stat"><b id="updatedText">-</b><span>마지막 갱신</span></div></div></header><div class="toolbar"><div id="liveBadge" class="badge live">● 자동 갱신 중</div><div>약 2초마다 자동 갱신됩니다.</div></div><div id="error" class="error"></div><main id="rooms" class="rooms"></main></div>
<script>

const AUTH_KEY = 'dashboard-auth-v1';
// 비밀번호를 5번 틀리면 이 기기(브라우저)에서는 1시간 동안 입력을 막아요.
// 잠금 기록은 localStorage에 남아서 새로고침·창 닫기·다른 현황 페이지에서도 유지돼요.
const LOCK_KEY = 'dashboard-auth-lock-v1', MAX_FAILS = 5, LOCK_MS = 60 * 60 * 1000;
function readLock() {
    const empty = { fails: 0, until: 0, last: 0 };
    try {
        const v = JSON.parse(localStorage.getItem(LOCK_KEY)) || {};
        if (!v.last || Date.now() - v.last > LOCK_MS) return empty; // 마지막 실패 후 1시간이 지나면 초기화
        return { fails: v.fails || 0, until: v.until || 0, last: v.last };
    } catch (e) { return empty; }
}
function writeLock(v) { try { localStorage.setItem(LOCK_KEY, JSON.stringify(v)); } catch (e) { /* 저장 불가 */ } }
function lockMinutesLeft() { const v = readLock(); return v.until > Date.now() ? Math.ceil((v.until - Date.now()) / 60000) : 0; }
async function checkDashboardPassword() {
    if (sessionStorage.getItem(AUTH_KEY) === 'ok') return true;
    const left = lockMinutesLeft();
    if (left) {
        alert(`비밀번호를 ${MAX_FAILS}번 틀려서 이 기기에서는 입력이 잠겨 있어요.\n${left}분 뒤에 다시 시도해 주세요.`);
        return false;
    }
    for (let i = 0; i < 3; i++) {
        const input = prompt('현황판 비밀번호를 입력하세요.');
        if (input === null) break;
        let res;
        try {
            res = await fetch('/api/dashboard-auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: input })
            });
        } catch (e) {
            alert('비밀번호 확인 서버에 연결할 수 없습니다.');
            return false;
        }
        if (res.ok) {
            sessionStorage.setItem(AUTH_KEY, 'ok');
            writeLock({ fails: 0, until: 0, last: 0 });
            return true;
        }
        if (res.status !== 403) { // 서버 오류는 틀린 횟수로 세지 않아요
            alert('비밀번호를 확인하는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            return false;
        }
        const v = readLock();
        v.fails++; v.last = Date.now();
        if (v.fails >= MAX_FAILS) {
            writeLock({ fails: 0, until: v.last + LOCK_MS, last: v.last });
            alert(`비밀번호를 ${MAX_FAILS}번 틀렸어요.\n이 기기에서는 1시간 동안 비밀번호를 입력할 수 없어요.`);
            return false;
        }
        writeLock(v);
        alert(`비밀번호가 맞지 않습니다. (남은 기회 ${MAX_FAILS - v.fails}번)`);
    }
    return false;
}
async function requireDashboardPassword() {
    if (await checkDashboardPassword()) return true;
    location.href = 'index.html';
    return false;
}

const GAME = 'omok'; const API = '/api/omok/dashboard'; const $ = id => document.getElementById(id);
function timeText(ts) { if (!ts) return '-'; return new Date(ts).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function roomCard(r) {
      const updated = r.ageSeconds < 20 ? `<span class="badge live">최근 ${r.ageSeconds}초 전</span>` : `<span class="badge stale">${r.ageSeconds}초 전</span>`;
      const logs = (r.lastLog || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>기록 없음</li>';
      const players = GAME === 'baduk'
        ? `<div class="teams"><section class="team black ${r.turn === '흑' && !r.winner ? 'current' : ''}"><div class="team-name">⚫ 흑</div><div><span class="team-count">${r.blackConnected ? 1 : 0}</span>명 접속</div><div class="pieces">따낸 돌 ${r.blackCaps || 0}</div></section><section class="team white ${r.turn === '백' && !r.winner ? 'current' : ''}"><div class="team-name">⚪ 백</div><div><span class="team-count">${r.whiteConnected ? 1 : 0}</span>명 접속</div><div class="pieces">따낸 돌 ${r.whiteCaps || 0} · 덤 ${esc(r.komi)}</div></section></div>`
        : `<div class="teams"><section class="team black ${r.turn === '흑' && !r.winner ? 'current' : ''}"><div class="team-name">⚫ 흑</div><div><span class="team-count">${r.blackConnected ? 1 : 0}</span>명 접속</div><div class="pieces">돌 ${r.blackStones || 0}개</div></section><section class="team white ${r.turn === '백' && !r.winner ? 'current' : ''}"><div class="team-name">⚪ 백</div><div><span class="team-count">${r.whiteConnected ? 1 : 0}</span>명 접속</div><div class="pieces">돌 ${r.whiteStones || 0}개</div></section></div>`;
      return `<article class="room">
        <h2><span class="code">${esc(r.roomId)}</span><span>${updated}</span></h2>
        <div class="phase">${r.winner ? `🏁 ${esc(r.winner)}` : `${esc(r.turn)} 차례 · ${esc(r.phase)}`}</div>
        ${players}
        <div class="meta">
          <div><b>공동참여자</b><br>${r.guestCount || 0}명</div>
          <div><b>착수 수</b><br>${r.moveCount || 0}수</div>
          <div><b>${GAME === 'baduk' ? '판/덤' : '규칙'}</b><br>${GAME === 'baduk' ? `${esc(r.size)}줄 · 덤 ${esc(r.komi)}` : esc(r.rule)}</div>
          <div><b>최근 수</b><br>${esc(r.lastMove || '-')}</div>
        </div>
        <ul class="log">${logs}</ul>
      </article>`;
    }

async function loadDashboard() {
  try {
    const res = await fetch(API, { cache:'no-store' }); const data = await res.json(); if (!data.ok) throw new Error(data.error || '현황 데이터를 가져오지 못했습니다.');
    $('error').style.display='none'; $('roomCount').textContent=data.totalRooms; $('activeCount').textContent=data.activeRooms; $('memberCount').textContent=data.totalPlayers; $('updatedText').textContent=timeText(data.now);
    $('rooms').innerHTML = data.rooms.length ? data.rooms.map(roomCard).join('') : '<div class="empty">아직 생성된 방이 없습니다.</div>';
    $('liveBadge').className='badge live'; $('liveBadge').textContent='● 자동 갱신 중';
  } catch (err) { $('error').style.display='block'; $('error').textContent=err.message; $('liveBadge').className='badge stale'; $('liveBadge').textContent='● 연결 확인 필요'; }
}
$('refreshBtn').addEventListener('click', loadDashboard); requireDashboardPassword().then((ok) => { if (ok) { loadDashboard(); setInterval(loadDashboard, 2000); } });
</script></body></html>
