<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>수학 모험섬</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0; min-height: 100vh; padding: 14px;
        font-family: 'Jua', 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
        background: linear-gradient(180deg, #8fd3fe 0%, #c6f1ff 55%, #fff3c4 100%);
        color: #2d3748; user-select: none;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    button { font: inherit; cursor: pointer; border: 0; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    h1 { margin: 4px 0; font-size: 28px; color: #1a4d7a; text-shadow: 0 2px 0 #fff; }
    .stat { display: flex; gap: 6px; align-items: center; }
    .pill { background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .icon-btn { background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 10px; font-size: 18px; }
    .card { background: rgba(255,255,255,.93); border-radius: 24px; padding: 18px; margin-top: 12px; box-shadow: 0 10px 30px rgba(26,77,122,.15); }
    .hello { display: flex; gap: 12px; align-items: center; }
    .mascot { font-size: 54px; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
    .bubble { background: #fffbe6; border: 2px solid #ffe08a; border-radius: 18px; padding: 10px 14px; font-size: 17px; line-height: 1.5; }
    h2 { margin: 6px 0 10px; font-size: 20px; color: #1a4d7a; }
    .ages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .age { background: #edf6ff; border: 3px solid transparent; border-radius: 16px; padding: 10px 6px; font-size: 16px; font-weight: 800; color: #1a4d7a; }
    .age small { display: block; font-weight: 600; font-size: 12px; color: #5a6b7d; margin-top: 2px; }
    .age.on { background: #fff; border-color: #ffb703; box-shadow: 0 4px 0 #ffb703; }
    .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .game { position: relative; border-radius: 20px; padding: 14px 10px 12px; color: white; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.15); transition: transform .1s; }
    .game:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
    .game .em { font-size: 42px; display: block; }
    .game b { display: block; font-size: 19px; margin-top: 2px; }
    .game span { font-size: 13px; opacity: .95; }
    .game .stars { position: absolute; top: 6px; right: 8px; font-size: 13px; letter-spacing: -2px; }
    .stickers { display: flex; flex-wrap: wrap; gap: 6px; font-size: 30px; min-height: 40px; }
    .stickers .lock { filter: grayscale(1); opacity: .25; }
    .hint { font-size: 13px; color: #5a6b7d; line-height: 1.6; }

    /* 게임 화면 */
    .play-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .back { background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 800; color: #1a4d7a; box-shadow: 0 3px 0 #c9d9ea; }
    .progress { flex: 1; height: 14px; background: rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb703, #fb8500); border-radius: 999px; transition: width .4s; }
    .prompt { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 28px; font-weight: 800; color: #1a4d7a; text-align: center; min-height: 64px; line-height: 1.3; flex-wrap: wrap; }
    .prompt .say { font-size: 22px; background: #edf6ff; border-radius: 999px; padding: 4px 10px; }
    .stage { position: relative; height: 340px; border-radius: 22px; overflow: hidden; margin-top: 10px; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 10px; margin-top: 12px; }
    .choice { background: #fff; border-radius: 18px; padding: 14px 6px; font-size: 30px; font-weight: 800; color: #1a4d7a; box-shadow: 0 5px 0 #c9d9ea; }
    .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9d9ea; }
    .wrong { animation: shake .35s; background: #ffe3e3 !important; }
    .right { background: #d3f9d8 !important; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .feedback { text-align: center; font-size: 20px; font-weight: 800; min-height: 30px; margin-top: 8px; }
    .feedback.good { color: #2b8a3e; } .feedback.bad { color: #c92a2a; }

    /* 물고기 */
    .sea { background: linear-gradient(180deg, #4dabf7, #1971c2); }
    .fish { position: absolute; font-size: 22px; font-weight: 800; color: #1a4d7a; background: #ffe066; border-radius: 50% 40% 40% 50%; padding: 10px 18px 10px 14px; box-shadow: 0 4px 0 rgba(0,0,0,.15); white-space: nowrap; transition: left linear; }
    .fish::after { content: ''; position: absolute; right: -16px; top: 50%; transform: translateY(-50%); border: 12px solid transparent; border-left: 16px solid #ffd43b; }
    .fish.flip { transform: scaleX(-1); } .fish.flip > span { display: inline-block; transform: scaleX(-1); }
    .bubbles { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 20% 80%, rgba(255,255,255,.25) 0 6px, transparent 7px), radial-gradient(circle at 70% 60%, rgba(255,255,255,.2) 0 4px, transparent 5px), radial-gradient(circle at 45% 30%, rgba(255,255,255,.2) 0 5px, transparent 6px); }
    /* 풍선 */
    .sky { background: linear-gradient(180deg, #a5d8ff, #e7f5ff); }
    .balloon { position: absolute; bottom: -110px; width: 82px; height: 98px; border-radius: 50% 50% 48% 48%; font-size: 26px; font-weight: 800; color: white; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 0 rgba(0,0,0,.25); box-shadow: inset -8px -10px 0 rgba(0,0,0,.12); }
    .balloon::after { content: ''; position: absolute; bottom: -26px; left: 50%; width: 2px; height: 26px; background: #868e96; }
    .pop { animation: pop .25s forwards; }
    @keyframes pop { to { transform: scale(1.6); opacity: 0; } }
    /* 개구리 */
    .pond { background: linear-gradient(180deg, #74c0fc, #339af0); }
    .pads { position: absolute; left: 0; right: 0; bottom: 70px; display: flex; justify-content: space-around; padding: 0 6px; }
    .pad { position: relative; width: 52px; height: 52px; border-radius: 50%; background: #51cf66; box-shadow: 0 4px 0 #2f9e44; color: white; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    .pad.small { width: 40px; height: 40px; font-size: 16px; }
    .pad.target { outline: 4px dashed #fff3bf; }
    .frog { position: absolute; bottom: 118px; font-size: 40px; transition: left .5s cubic-bezier(.3,1.6,.6,1); transform: translateX(-50%); }
    /* 짝꿍 카드 */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    .tile { aspect-ratio: 1; border-radius: 18px; background: #fff; font-size: 30px; font-weight: 800; color: #1a4d7a; box-shadow: 0 5px 0 #c9d9ea; }
    .tile.sel { background: #fff3bf; box-shadow: 0 5px 0 #ffd43b; }
    .tile.done { visibility: hidden; }
    /* 가게 */
    .shop { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .item { font-size: 70px; }
    .price { font-size: 30px; font-weight: 800; color: #e8590c; }
    .tray { min-height: 70px; background: #fff9db; border: 3px dashed #ffd43b; border-radius: 18px; margin-top: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
    .paid { font-size: 22px; font-weight: 800; color: #1a4d7a; text-align: center; margin-top: 6px; }
    .coins { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
    .coin { width: 72px; height: 72px; border-radius: 50%; font-weight: 800; font-size: 17px; color: #5c3d00; background: radial-gradient(circle at 35% 30%, #fff3bf, #fcc419 60%, #e67700); box-shadow: 0 4px 0 #a35b00; }
    .coin.silver { color: #343a40; background: radial-gradient(circle at 35% 30%, #fff, #ced4da 60%, #868e96); box-shadow: 0 4px 0 #495057; }
    .coin.bill { width: 100px; height: 56px; border-radius: 8px; color: #fff; background: linear-gradient(135deg, #69db7c, #2f9e44); box-shadow: 0 4px 0 #2b8a3e; }
    .coin.mini { width: 44px; height: 44px; font-size: 12px; box-shadow: none; }
    .coin.bill.mini { width: 60px; height: 34px; }
    .row-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .btn { background: #339af0; color: white; border-radius: 16px; padding: 12px 22px; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 #1c7ed6; }
    .btn.gray { background: #e9ecef; color: #495057; box-shadow: 0 5px 0 #ced4da; }
    /* 레이스 */
    .track { background: linear-gradient(180deg, #8ce99a 0 30%, #868e96 30% 70%, #8ce99a 70%); height: 120px; }
    .track .line { position: absolute; left: 0; right: 0; top: 50%; border-top: 4px dashed #fff; }
    .track .finish { position: absolute; right: 10px; top: 30%; bottom: 30%; width: 16px; background: repeating-linear-gradient(0deg, #000 0 8px, #fff 8px 16px); }
    .car { position: absolute; top: 50%; transform: translate(-50%, -55%) scaleX(-1); font-size: 44px; transition: left .4s; }
    .timer { font-size: 22px; font-weight: 800; color: #e8590c; text-align: center; }

    /* 결과 */
    .result { text-align: center; }
    .result .big { font-size: 64px; letter-spacing: 6px; }
    .confetti { position: fixed; top: -20px; font-size: 24px; pointer-events: none; animation: fall 2.2s linear forwards; z-index: 50; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

    .footer { text-align: center; margin: 18px 0 6px; color: #1a4d7a; font-size: 14px; }
    .footer a { color: #1864ab; font-weight: 700; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
        h1 { font-size: 23px; }
        .prompt { font-size: 24px; }
        .stage { height: 300px; }
        .choice { font-size: 26px; }
        .pad { width: 40px; height: 40px; font-size: 16px; }
        .pad.small { width: 30px; height: 30px; font-size: 12px; }
        .games { grid-template-columns: repeat(2, 1fr); }
        .game .em { font-size: 34px; }
        .game b { font-size: 17px; }
        .balloon { width: 66px; height: 80px; font-size: 22px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h1>🏝️ 수학 모험섬</h1>
        <div class="stat">
            <span class="pill" id="starTotal">⭐ 0</span>
            <button class="icon-btn" id="voiceBtn" title="문제 읽어 주기" aria-label="문제 읽어 주기">🗣️</button>
            <button class="icon-btn" id="soundBtn" title="소리" aria-label="소리">🔊</button>
        </div>
    </div>

    <!-- 메인 -->
    <section id="home">
        <div class="card">
            <div class="hello">
                <div class="mascot">🐢</div>
                <div class="bubble" id="greet">안녕! 나는 거북이 <b>또또</b>야. 모험섬에서 수학 놀이 하자!</div>
            </div>
        </div>
        <div class="card">
            <h2>몇 살 친구예요?</h2>
            <div class="ages" id="ages">
                <button class="age" data-age="0">🐣 유아<small>5~7살</small></button>
                <button class="age" data-age="1">🐥 초등 1~2</button>
                <button class="age" data-age="2">🦅 초등 3~4</button>
            </div>
        </div>
        <div class="card">
            <h2>어떤 놀이를 할까요?</h2>
            <div class="games" id="games"></div>
        </div>
        <div class="card">
            <h2>🎁 스티커 모으기 <span class="hint" id="stickerHint"></span></h2>
            <div class="stickers" id="stickers"></div>
        </div>
    </section>

    <!-- 놀이 -->
    <section id="play" hidden>
        <div class="card">
            <div class="play-top">
                <button class="back" id="backBtn">← 섬으로</button>
                <div class="progress"><i id="bar"></i></div>
                <span class="pill" id="score">0 / 10</span>
            </div>
            <div class="prompt"><span id="prompt"></span><button class="say" id="sayBtn" aria-label="다시 듣기">🔊</button></div>
            <div id="board"></div>
            <div class="feedback" id="feedback"></div>
        </div>
    </section>

    <!-- 결과 -->
    <section id="result" hidden>
        <div class="card result">
            <div class="mascot">🐢</div>
            <h2 id="resTitle">잘했어요!</h2>
            <div class="big" id="resStars">⭐⭐⭐</div>
            <p class="bubble" id="resMsg"></p>
            <div class="row-btns">
                <button class="btn" id="againBtn">🔁 한 번 더</button>
                <button class="btn gray" id="homeBtn">🏝️ 섬으로</button>
            </div>
        </div>
    </section>

    <p class="footer">made by jeongik<br>문의 : <a href="mailto:chojeongik@naver.com">chojeongik@naver.com</a></p>
</div>

<script>
'use strict';
// ===== 문제 만들기 (화면과 무관한 순수 함수, 테스트에서도 사용) =====
const MathIsland = (() => {
    const int = (rnd, a, b) => a + Math.floor(rnd() * (b - a + 1));
    const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
    const shuffle = (rnd, arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    // 정답 주변의 그럴듯한 오답 (음수 없음, 중복 없음)
    function distractors(rnd, answer, count, spread, min = 0) {
        const set = new Set([answer]);
        let guard = 0;
        while (set.size < count + 1 && guard++ < 200) {
            const d = int(rnd, 1, spread) * (rnd() < 0.5 ? -1 : 1);
            const v = answer + d;
            if (v >= min) set.add(v);
        }
        for (let v = answer + 1; set.size < count + 1; v++) set.add(v);
        return shuffle(rnd, [...set]);
    }
    const EMOJI = ['🍎', '🍓', '🐟', '⭐', '🌸', '🐥', '🍪', '🎈', '🚗', '🦋'];

    // 나이별 기본 문제: 0 유아(세기·10까지 더하기), 1 초등 1~2(20까지 덧뺄셈), 2 초등 3~4(구구단·나눗셈·두 자리)
    function basic(rnd, age) {
        if (age === 0) {
            if (rnd() < 0.5) {
                const n = int(rnd, 1, 10), e = pick(rnd, EMOJI);
                return { text: `${e.repeat(n)}`, speak: `${e === '⭐' ? '별' : '그림'}이 몇 개일까요?`, ask: '몇 개일까요?', answer: n, spread: 2, min: 1 };
            }
            const a = int(rnd, 1, 5), b = int(rnd, 1, 5);
            return { text: `${a} + ${b}`, speak: `${a} 더하기 ${b}는?`, answer: a + b, spread: 2, min: 1 };
        }
        if (age === 1) {
            if (rnd() < 0.5) { const a = int(rnd, 3, 15), b = int(rnd, 2, 20 - a); return { text: `${a} + ${b}`, speak: `${a} 더하기 ${b}는?`, answer: a + b, spread: 3 }; }
            const a = int(rnd, 6, 20), b = int(rnd, 1, a - 1); return { text: `${a} − ${b}`, speak: `${a} 빼기 ${b}는?`, answer: a - b, spread: 3 };
        }
        const r = rnd();
        if (r < 0.5) { const a = int(rnd, 2, 9), b = int(rnd, 2, 9); return { text: `${a} × ${b}`, speak: `${a} 곱하기 ${b}는?`, answer: a * b, spread: 6, min: 1 }; }
        if (r < 0.75) { const b = int(rnd, 2, 9), q = int(rnd, 2, 9); return { text: `${b * q} ÷ ${b}`, speak: `${b * q} 나누기 ${b}는?`, answer: q, spread: 3, min: 1 }; }
        const a = int(rnd, 12, 68), b = int(rnd, 11, 99 - a); return { text: `${a} + ${b}`, speak: `${a} 더하기 ${b}는?`, answer: a + b, spread: 10 };
    }
    function withChoices(rnd, q, n = 4) { return { ...q, choices: distractors(rnd, q.answer, n - 1, q.spread || 3, q.min ?? 0) }; }

    const GAMES = {
        // 🐟 물고기 잡기: 정답 숫자가 적힌 물고기를 잡아요
        fish(rnd, age) {
            if (age === 0) { const n = int(rnd, 1, 10); return { text: `${n}`, speak: `숫자 ${n} 물고기를 잡아요!`, ask: '물고기를 잡아요', answer: n, choices: distractors(rnd, n, 4, 4, 1) }; }
            return withChoices(rnd, basic(rnd, age), 5);
        },
        // 🎈 풍선 터뜨리기: 정답 풍선을 날아가기 전에 터뜨려요
        balloon(rnd, age) { return withChoices(rnd, basic(rnd, age), 4); },
        // 🐸 개구리 징검다리: 수직선 위에서 뛰어 세기 (보기는 화면의 연잎 가운데 정답 가까운 것)
        frog(rnd, age) {
            const q = frogQ(rnd, age);
            const pads = frogPads(q), i = pads.indexOf(q.answer);
            const near = pads.filter((v) => v !== q.answer && v !== q.start).sort((x, y) => Math.abs(pads.indexOf(x) - i) - Math.abs(pads.indexOf(y) - i) || rnd() - 0.5);
            q.choices = shuffle(rnd, [q.answer, ...near.slice(0, 3)]);
            return q;
        },
    };
    function frogQ(rnd, age) {
        if (age === 0) { const max = 10, start = int(rnd, 0, 6), step = int(rnd, 1, Math.min(3, max - start)); return { max, start, step, answer: start + step, text: `${start}에서 ${step}칸 앞으로!`, speak: `${start}에서 ${step}칸 앞으로 뛰면 어디일까요?` }; }
        if (age === 1) {
            const max = 20, start = int(rnd, 2, 18), fwd = rnd() < 0.5;
            const step = fwd ? int(rnd, 2, Math.min(6, max - start)) : int(rnd, 2, Math.min(6, start));
            const answer = fwd ? start + step : start - step;
            return { max, start, step: fwd ? step : -step, answer, text: `${start}에서 ${step}칸 ${fwd ? '앞으로' : '뒤로'}!`, speak: `${start}에서 ${step}칸 ${fwd ? '앞으로' : '뒤로'} 뛰면 어디일까요?` };
        }
        const by = pick(rnd, [2, 5, 10, 3, 4]), max = by * 10, start = by * int(rnd, 1, 6), jumps = int(rnd, 2, 4);
        return { max, by, start, step: by * jumps, answer: start + by * jumps, text: `${start}에서 ${by}씩 ${jumps}번 뛰면?`, speak: `${start}에서 ${by}씩 ${jumps}번 뛰면 어디일까요?` };
    }
    Object.assign(GAMES, {
        // 🧩 짝꿍 찾기: 두 수를 더해 목표 수 만들기
        pair(rnd, age) {
            const target = age === 0 ? 5 : age === 1 ? 10 : 100;
            const used = new Set(), pairs = [];
            let guard = 0;
            while (pairs.length < 4 && guard++ < 300) {
                const a = age === 2 ? int(rnd, 1, 9) * 10 + (rnd() < 0.5 ? 0 : 5) : int(rnd, 1, target - 1);
                const b = target - a;
                // 유아(5 만들기)는 짝이 2가지뿐이라 같은 짝이 다시 나와도 괜찮아요
                if (age !== 0 && (used.has(a) || used.has(b))) continue;
                used.add(a); used.add(b); pairs.push([a, b]);
            }
            const ga = target === 5 ? '가' : '이';
            return { target, tiles: shuffle(rnd, pairs.flat()), text: `더해서 ${target}${ga} 되는 짝꿍을 찾아요`, speak: `더해서 ${target}${ga} 되는 두 수를 찾아요!` };
        },
        // 🛒 시장 놀이: 동전으로 딱 맞게 내기
        shop(rnd, age) {
            const items = ['🍭', '🍦', '🧃', '🍙', '🥐', '✏️', '🧸', '🎨', '📒', '🍩'];
            const coins = age === 0 ? [10] : age === 1 ? [10, 50, 100] : [10, 50, 100, 500, 1000];
            const price = age === 0 ? 10 * int(rnd, 1, 9) : age === 1 ? 10 * int(rnd, 3, 50) : 10 * int(rnd, 30, 300);
            return { item: pick(rnd, items), price, coins, text: `${price}원을 딱 맞게 내요`, speak: `${price}원을 동전으로 딱 맞게 내 볼까요?` };
        },
        // 🏁 자동차 경주: 60초 동안 빨리 풀기
        race(rnd, age) {
            if (age === 0) {
                const a = int(rnd, 1, 10); let b = int(rnd, 1, 10); if (a === b) b = a === 10 ? 9 : a + 1;

$('games').addEventListener('click', (e) => { const b = e.target.closest('[data-game]'); if (b) { sfx('tap'); startGame(b.dataset.game); } });
$('backBtn').addEventListener('click', () => { clearTimers(); G = null; renderHome(); show('home'); });
$('homeBtn').addEventListener('click', () => { renderHome(); show('home'); });
$('againBtn').addEventListener('click', () => startGame(G.key));
$('sayBtn').addEventListener('click', () => { if (G && G.q) { const was = save.voice; save.voice = true; speak(G.q.speak || G.q.text); save.voice = was; } });
$('soundBtn').addEventListener('click', () => { save.sound = !save.sound; persist(); renderHome(); });
$('voiceBtn').addEventListener('click', () => { save.voice = !save.voice; persist(); renderHome(); if (save.voice) speak('문제를 읽어 줄게요'); else if (window.speechSynthesis) speechSynthesis.cancel(); });
renderHome();
}
</script>
</body>
</html>
