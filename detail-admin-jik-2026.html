    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        .card {

        }
        .avatar {

        }
        .name { font-size: 28px; font-weight: 700; color: #2d3748; margin-bottom: 8px; }
        .title { font-size: 16px; color: #667eea; font-weight: 600; margin-bottom: 24px; }
        .divider {

            margin: 0 auto 24px; border-radius: 2px;
        }
        .bio { font-size: 16px; line-height: 1.8; color: #4a5568; margin-bottom: 32px; }
        .contact { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .contact a {

        }
        .contact a:hover { background: #667eea; color: white; border-color: #667eea; }
        .contact .disabled {
            display: inline-block; padding: 10px 20px; background: #edf2f7;
            color: #a0aec0; border-radius: 10px; font-size: 14px;
            border: 1px solid #e2e8f0; cursor: not-allowed; user-select: none;
        }
        .more-links { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .more-links h2 { font-size: 15px; color: #4a5568; margin-bottom: 12px; }
        .more-links a {
            display: block; margin: 8px auto 0; padding: 10px 16px; max-width: 280px;
            background: #fff; color: #667eea; text-decoration: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; border: 1px solid #e2e8f0; transition: all 0.3s;

        .footer { margin-top: 32px; font-size: 13px; color: #a0aec0; }

</head>
<body>

    <script>
        const AUTH_KEY = 'dashboard-auth-v1';
        const LOCK_KEY = 'dashboard-auth-lock-v1';
        const MAX_FAILS = 5;
        const LOCK_MS = 60 * 60 * 1000;
        function readLock() {
            const empty = { fails: 0, until: 0, last: 0 };
            try {
                const v = JSON.parse(localStorage.getItem(LOCK_KEY)) || {};
                if (!v.last || Date.now() - v.last > LOCK_MS) return empty;
                return { fails: v.fails || 0, until: v.until || 0, last: v.last };
            } catch (e) { return empty; }
        }
        function writeLock(v) {
            try { localStorage.setItem(LOCK_KEY, JSON.stringify(v)); } catch (e) { /* 저장 불가 */ }
        }
        function clearLock() { writeLock({ fails: 0, until: 0, last: 0 }); }
        function lockMinutesLeft() {
            const v = readLock();
            return v.until > Date.now() ? Math.ceil((v.until - Date.now()) / 60000) : 0;
        }
        async function requireDashboardPassword() {
            if (sessionStorage.getItem(AUTH_KEY) === 'ok') return true;
            const left = lockMinutesLeft();
            if (left) {
                alert(`비밀번호를 ${MAX_FAILS}번 틀려서 이 기기에서는 입력이 잠겨 있어요.
${left}분 뒤에 다시 시도해 주세요.`);
                return false;
            }
            for (let i = 0; i < 3; i++) {
                const input = prompt('현황판 비밀번호를 입력하세요.');
                if (input === null) break;
                let res;
                try {
                    res = await fetch('/api/dashboard-auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: input })
                    });
                } catch (e) {
                    alert('비밀번호 확인 서버에 연결할 수 없습니다.');
                    return false;
                }
                if (res.ok) {
                    sessionStorage.setItem(AUTH_KEY, 'ok');
                    clearLock();
                    return true;
                }
                if (res.status !== 403) {
                    alert('비밀번호를 확인하는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
                    return false;
                }
                const v = readLock();
                v.fails += 1;
                v.last = Date.now();
                if (v.fails >= MAX_FAILS) {
                    writeLock({ fails: 0, until: v.last + LOCK_MS, last: v.last });
                    alert(`비밀번호를 ${MAX_FAILS}번 틀렸어요.
이 기기에서는 1시간 동안 비밀번호를 입력할 수 없어요.`);
                    return false;
                }
                writeLock(v);
                alert(`비밀번호가 맞지 않습니다. (남은 기회 ${MAX_FAILS - v.fails}번)`);
            }
            return false;
        }
        document.querySelectorAll('.dashboard-link').forEach((a) => {
            a.addEventListener('click', async (e) => {
                e.preventDefault();
                if (await requireDashboardPassword()) location.href = a.href;
            });
        });
    </script>
</body>
</html>
