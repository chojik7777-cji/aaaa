<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학게임 중앙 통제</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:18px; font-family:'Segoe UI','맑은 고딕',sans-serif; background:linear-gradient(135deg,#1a365d,#553c9a); color:#243042; display:flex; justify-content:center; align-items:flex-start; }
    .card { width:100%; max-width:720px; background:#fff; border-radius:22px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.32); }
    h1 { margin:0 0 8px; text-align:center; font-size:26px; }
    .sub { text-align:center; color:#718096; line-height:1.6; margin-bottom:18px; }
    label { display:grid; gap:6px; margin-top:12px; color:#4a5568; font-weight:800; }
    input, textarea { width:100%; padding:12px; border:1px solid #cbd5e0; border-radius:12px; font:inherit; }
    textarea { min-height:86px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    button { border:0; border-radius:12px; padding:13px 14px; font:inherit; font-weight:900; cursor:pointer; color:white; }
    #lockOnBtn { background:#e53e3e; }
    #lockOffBtn { background:#38a169; }
    #refreshBtn { background:#4a5568; }
    .status { margin-top:16px; padding:14px; border-radius:14px; background:#f7fafc; border:1px solid #e2e8f0; line-height:1.7; }
    .badge { display:inline-block; border-radius:999px; padding:3px 10px; font-weight:900; }
    .locked { background:#fed7d7; color:#9b2c2c; }
    .open { background:#c6f6d5; color:#276749; }
    a { color:#5a67d8; font-weight:800; text-decoration:none; }
    @media (max-width:560px){ .row{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔐 수학게임 중앙 통제</h1>
    <p class="sub">잠금을 켜면 학생들의 수학게임 화면에 비밀번호 입력 오버레이가 뜹니다.<br>문제 제한 수를 바꾸면 학생 화면이 약 5초마다 새 설정을 반영합니다.</p>

    <label>관리자 비밀번호
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="관리자 비밀번호">
    </label>
    <label>학생 해제 비밀번호
      <input id="unlockPassword" type="text" inputmode="numeric" placeholder="예: 2468">
    </label>
    <div class="row">
      <label>문제 제한 수
        <input id="questionLimit" type="number" min="0" max="999" step="1" value="5" placeholder="예: 5">
      </label>
      <label>제한 해제 비밀번호
        <input id="limitPassword" type="text" inputmode="numeric" value="1414" placeholder="예: 1414">
      </label>
    </div>
    <label>잠금 안내문
      <textarea id="lockMessage">선생님 확인 후 계속하세요.</textarea>
    </label>

    <div class="row">
      <button id="lockOnBtn" type="button">잠금 ON</button>
      <button id="lockOffBtn" type="button">잠금 OFF</button>
    </div>
    <div class="row">
      <button id="refreshBtn" type="button">상태 새로고침</button>
      <a href="math-level.html" style="align-self:center;text-align:center">수학게임 열기 →</a>
    </div>

    <div class="status" id="statusBox">상태 확인 중...</div>
  </main>

<script>
'use strict';
const $ = id => document.getElementById(id);
function showStatus(data) {
  const badge = data.locked ? '<span class="badge locked">잠금 ON</span>' : '<span class="badge open">잠금 OFF</span>';
  $('statusBox').innerHTML = `${badge}<br>문제 제한: ${Number(data.questionLimit ?? 5)}문제 초과 시 비밀번호 요구<br>안내문: ${escapeHtml(data.message || '')}<br>버전: ${data.version ?? '-'}<br>갱신: ${data.updatedAt ? new Date(data.updatedAt).toLocaleString('ko-KR') : '-'}`;
  $('questionLimit').value = Number(data.questionLimit ?? 5);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}
async function refreshState() {
  const res = await fetch('/api/math-control?action=status', { cache: 'no-store' });
  showStatus(await res.json());
}
async function setLock(locked) {
  const body = {
    adminPassword: $('adminPassword').value,
    locked,
    message: $('lockMessage').value,
    unlockPassword: $('unlockPassword').value,
    questionLimit: Number($('questionLimit').value),
    limitPassword: $('limitPassword').value,
  };
  const res = await fetch('/api/math-control?action=set', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store'
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '통제 상태 변경 실패');
  showStatus(data);
}
$('lockOnBtn').addEventListener('click', () => setLock(true).catch(e => alert(e.message)));
$('lockOffBtn').addEventListener('click', () => setLock(false).catch(e => alert(e.message)));
$('refreshBtn').addEventListener('click', () => refreshState().catch(e => alert(e.message)));
refreshState().catch(e => { $('statusBox').textContent = e.message; });
</script>
</body>
</html>
