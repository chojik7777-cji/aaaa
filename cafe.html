<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페 운영 게임</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            font-family: 'Segoe UI', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex;
            justify-content: center; align-items: flex-start; padding: 16px;
            color: #2d3748;
        }
        .card {
            background: white; border-radius: 20px;
            padding: 24px 20px; max-width: 720px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
        .sub { text-align: center; font-size: 13px; color: #718096; margin-bottom: 14px; }
        h2 { font-size: 16px; color: #4a5568; margin: 18px 0 8px; }
        button {
            font-family: inherit; font-size: 14px; cursor: pointer;
            padding: 8px 12px; border-radius: 10px; border: 1px solid #e2e8f0;
            background: #f7fafc; color: #4a5568; transition: all 0.15s;
        }
        button:hover:not(:disabled) { background: #667eea; color: white; border-color: #667eea; }
        button:disabled { opacity: 0.4; cursor: default; }
        button:focus-visible { outline: 2px solid #667eea; outline-offset: 2px; }
        .primary { background: #667eea; color: white; border-color: #667eea; font-weight: 600; }
        .primary:hover:not(:disabled) { background: #5a67d8; }

        .stats {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px;
            font-variant-numeric: tabular-nums;
        }
        .stat { text-align: center; }
        .stat .k { font-size: 12px; color: #718096; }
        .stat .v { font-size: 16px; font-weight: 700; color: #2d3748; white-space: nowrap; }
        .stars { color: #d69e2e; letter-spacing: 1px; }

        /* 준비 화면 */
        .forecast { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #fefcbf; color: #744210; font-size: 14px; }
        .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
        .item {
            border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; gap: 6px; font-size: 13px;
        }
        .item .t { font-weight: 700; font-size: 14px; }
        .item .d { color: #718096; line-height: 1.5; flex: 1; }
        .item.done { background: #f0fff4; border-color: #9ae6b4; }
        .seg { display: flex; gap: 6px; flex-wrap: wrap; }
        .seg button.on { background: #764ba2; color: white; border-color: #764ba2; }
        .toggles { display: grid; gap: 8px; }
        .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; font-size: 13px; }
        .toggle.on { background: #faf5ff; border-color: #b794f4; }
        .start-row { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .start-row .primary { padding: 12px 28px; font-size: 16px; }

        /* 영업 화면 */
        .timebar { height: 8px; background: #edf2f7; border-radius: 4px; overflow: hidden; margin: 12px 0 4px; }
        .timebar div { height: 100%; background: linear-gradient(90deg, #f6ad55, #ed64a6); width: 0; }
        .clock { display: flex; justify-content: space-between; font-size: 12px; color: #718096; }
        .counter {
            margin-top: 10px; min-height: 150px; border-radius: 14px; padding: 10px;
            background: repeating-linear-gradient(90deg, #f7ecdf 0 40px, #f3e3d0 40px 80px);
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
        }
        .slot { border: 2px dashed #e2cfb6; border-radius: 12px; min-height: 130px; }
        .cust {
            background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px 6px;
            text-align: center; cursor: pointer; min-height: 130px; display: flex; flex-direction: column;
            align-items: center; gap: 4px; position: relative; animation: pop 0.25s ease-out;
        }
        .cust:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .cust .face { font-size: 30px; line-height: 1; }
        .cust .order { font-size: 12px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
        .cust .price { font-size: 11px; color: #718096; }
        .cust .key { position: absolute; top: 4px; left: 6px; font-size: 10px; color: #a0aec0; font-weight: 700; }
        .pbar { width: 100%; height: 6px; background: #edf2f7; border-radius: 3px; overflow: hidden; margin-top: auto; }
        .pbar div { height: 100%; background: #48bb78; }
        .cust.warn { border-color: #f6ad55; }
        .cust.danger { border-color: #fc8181; animation: shake 0.4s infinite; }
        .cust.bad { background: #fff5f5; }
        @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

        .work { display: grid; grid-template-columns: 1fr 190px; gap: 10px; margin-top: 12px; }
        .ings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-content: start; }
        .ing {
            position: relative; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
            overflow: hidden;
        }
        .ing .ic { font-size: 24px; line-height: 1; }
        .ing .nm { font-size: 12px; }
        .ing .cnt { font-size: 11px; color: #718096; }
        .ing:hover:not(:disabled) .cnt { color: white; }
        .ing .kb { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #a0aec0; }
        .ing .brew { position: absolute; left: 0; bottom: 0; height: 4px; background: #975a16; width: 0; }
        .cup {
            border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
            background: #fffaf0;
        }
        .cup .title { font-size: 13px; font-weight: 700; color: #744210; }
        .cup .contents { min-height: 64px; font-size: 14px; line-height: 1.7; }
        .cup .contents .empty { color: #a0aec0; font-size: 13px; }
        .chip { display: inline-block; background: white; border: 1px solid #fbd38d; border-radius: 999px; padding: 0 8px; margin: 2px; font-size: 13px; }
        .guess { font-size: 12px; color: #2f855a; font-weight: 600; min-height: 16px; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; }
        .hint { font-size: 12px; color: #718096; margin-top: 10px; line-height: 1.6; text-align: center; }

        .toast-wrap { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 20; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
        .toast { background: rgba(45,55,72,0.92); color: white; padding: 8px 14px; border-radius: 999px; font-size: 14px; animation: pop 0.2s ease-out; text-align: center; }
        .toast.good { background: rgba(47,133,90,0.95); }
        .toast.bad { background: rgba(197,48,48,0.95); }

        details.recipes { margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f7fafc; }
        details.recipes summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14px; color: #4a5568; }
        .recipe-list { padding: 0 14px 12px; font-size: 13px; line-height: 1.9; color: #4a5568; }

        .modal-bg { position: fixed; inset: 0; background: rgba(26,32,44,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
        .modal { background: white; border-radius: 18px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
        .modal h3 { font-size: 20px; text-align: center; margin-bottom: 14px; }
        .report { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
        .report td { padding: 6px 4px; border-bottom: 1px solid #edf2f7; }
        .report td:last-child { text-align: right; font-weight: 600; }
        .report tr.total td { border-top: 2px solid #cbd5e0; border-bottom: none; font-size: 16px; }
        .plus { color: #2f855a; } .minus { color: #c53030; }
        .modal .msg { text-align: center; font-size: 14px; color: #4a5568; margin: 12px 0; line-height: 1.6; }
        .modal .row { justify-content: center; margin-top: 14px; }
        .footer { margin-top: 18px; font-size: 13px; text-align: center; }
        .footer a { color: #667eea; text-decoration: none; }

        .audio-row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
        .audio-row button { padding: 5px 10px; font-size: 13px; }
        .audio-row button.off { opacity: 0.55; }
        #scene {
            display: block; width: 100%; aspect-ratio: 720 / 330; margin-top: 8px;
            border-radius: 14px; background: #f1e3cf; cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 6px 18px rgba(0,0,0,0.12);
        }

        @media (max-width: 560px) {
            .card { padding: 18px 12px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .counter { grid-template-columns: repeat(3, 1fr); }
            .work { grid-template-columns: 1fr; }
            .cust .key, .ing .kb { display: none; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>☕ 조이이익 카페</h1>
    <p class="sub">음료를 만들어 손님을 만족시키고 카페를 키워보세요! 목표: 💰 1,000,000원</p>

    <div class="stats">
        <div class="stat"><div class="k">날짜</div><div class="v" id="sDay"></div></div>
        <div class="stat"><div class="k">자금</div><div class="v" id="sMoney"></div></div>
        <div class="stat"><div class="k">평판</div><div class="v stars" id="sRep"></div></div>
        <div class="stat"><div class="k">날씨</div><div class="v" id="sWeather"></div></div>
    </div>

    <div class="audio-row">
        <button id="musicBtn" title="단축키: M">🎵 음악</button>
        <button id="sfxBtn">🔊 효과음</button>
    </div>
    <canvas id="scene" width="720" height="330" aria-label="카페 매장 내부 모습. 영업 중에는 손님을 눌러서 서빙할 수도 있어요."></canvas>

    <!-- 준비 화면 -->
    <section id="prep">
        <div class="forecast" id="forecast"></div>

        <h2>🛒 재료 구매</h2>
        <div class="shop" id="shopStock"></div>

        <h2>📋 메뉴 개발</h2>
        <div class="shop" id="shopMenu"></div>

        <h2>🔧 가게 업그레이드</h2>
        <div class="shop" id="shopUpg"></div>

        <h2>💸 오늘의 가격 정책</h2>
        <div class="seg" id="priceSeg"></div>

        <h2>📣 오늘의 운영</h2>
        <div class="toggles" id="dailyOpts"></div>

        <div class="start-row">
            <button class="primary" id="openBtn">🔔 영업 시작</button>
            <button id="resetBtn">처음부터 다시</button>
        </div>
    </section>

    <!-- 영업 화면 -->
    <section id="play" hidden>
        <div class="timebar"><div id="timeFill"></div></div>
        <div class="clock"><span>09:00 오픈</span><span id="clockNow">09:00</span><span>21:00 마감</span></div>
        <div class="counter" id="counter"></div>

        <div class="work">
            <div class="ings" id="ings"></div>
            <div class="cup">
                <div class="title">🥤 제조 중인 컵</div>
                <div class="contents" id="cupContents"></div>
                <div class="guess" id="cupGuess"></div>
                <div class="row">
                    <button id="trashBtn" title="단축키: X 또는 Backspace">🗑️ 버리기</button>
                    <button id="pauseBtn" title="단축키: P">⏸️ 일시정지</button>
                </div>
            </div>
        </div>
        <p class="hint">재료를 눌러 컵에 담고 → 주문과 같아지면 <b>손님 카드를 눌러 서빙</b>하세요.<br>
            키보드: 숫자 <b>1~8</b> 재료 · <b>Q W E R T</b> 손님에게 서빙 · <b>X</b> 버리기 · <b>P</b> 일시정지</p>

        <details class="recipes" open>
            <summary>📖 레시피 북</summary>
            <div class="recipe-list" id="recipeList"></div>
        </details>
    </section>

    <p class="footer"><a href="index.html">← 메인으로</a></p>
</div>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal"></div></div>

<script>
'use strict';

// ===== 게임 데이터 =====
const DAY_LEN = 90;            // 하루 영업 시간(초)
const GOAL = 1000000;
const SAVE_KEY = 'cafe-game-save-v1';
const ALBA_WAGE = 25000;
const FLYER_COST = 10000;

const INGS = {
    shot:   { name: '에스프레소', icon: '☕', stock: true },
    water:  { name: '물',        icon: '💧', stock: false },
    milk:   { name: '우유',      icon: '🥛', stock: true },
    ice:    { name: '얼음',      icon: '🧊', stock: false },
    syrup:  { name: '바닐라시럽', icon: '🍯', stock: true, need: 'vanilla' },
    choco:  { name: '초코',      icon: '🍫', stock: true, need: 'mocha' },
    matcha: { name: '녹차가루',   icon: '🍵', stock: true, need: 'greentea' },
    cake:   { name: '케이크',     icon: '🍰', stock: true, need: 'cake' },
};
const ING_ORDER = ['shot', 'water', 'milk', 'ice', 'syrup', 'choco', 'matcha', 'cake'];

const PACKS = {
    shot:   { qty: 10, cost: 5000 },
    milk:   { qty: 10, cost: 6000 },
    syrup:  { qty: 10, cost: 3000 },
    choco:  { qty: 10, cost: 4000 },
    matcha: { qty: 10, cost: 5000 },
    cake:   { qty: 5,  cost: 10000 },
};

const MENU = {
    americano: { name: '아메리카노', base: { shot: 1, water: 1 }, price: 3000, coffee: true },
    latte:     { name: '카페라떼',   base: { shot: 1, milk: 1 },  price: 4000, coffee: true },
    vanilla:   { name: '바닐라라떼', base: { shot: 1, milk: 1, syrup: 1 }, price: 4500, coffee: true, unlock: 20000 },
    mocha:     { name: '카페모카',   base: { shot: 1, milk: 1, choco: 1 }, price: 5000, coffee: true, unlock: 30000 },
    greentea:  { name: '녹차라떼',   base: { matcha: 1, milk: 1 }, price: 4500, coffee: false, unlock: 30000 },
};
const CAKE = { name: '조각 케이크', price: 5500, unlock: 40000 };

const UPGRADES = {
    machine:  { name: '에스프레소 머신', icon: '⚙️', costs: [40000, 90000], vals: [1.6, 1.0, 0.5],
                desc: v => `샷 추출 ${v}초` },
    seats:    { name: '좌석 확장', icon: '🪑', costs: [40000, 100000], vals: [3, 4, 5],
                desc: v => `동시 손님 ${v}명 (임대료 +5,000원)` },
    interior: { name: '인테리어', icon: '🪴', costs: [50000, 120000], vals: [1, 1.25, 1.5],
                desc: v => `손님 인내심 x${v}` },
};

const PRICE_LEVELS = [
    { name: '할인 (x0.8)', mul: 0.8, traffic: 1.3 },
    { name: '보통 (x1.0)', mul: 1.0, traffic: 1.0 },
    { name: '프리미엄 (x1.25)', mul: 1.25, traffic: 0.7 },
];

const WEATHERS = {
    sunny: { name: '맑음', icon: '☀️', ice: 0.45, traffic: 1.1, text: '손님이 조금 많아요.' },
    hot:   { name: '폭염', icon: '🔥', ice: 0.85, traffic: 1.0, text: '아이스 음료 주문이 쏟아져요!' },
    rain:  { name: '비',   icon: '🌧️', ice: 0.25, traffic: 0.8, text: '손님이 적고 따뜻한 음료가 인기예요.' },
    cold:  { name: '한파', icon: '❄️', ice: 0.08, traffic: 0.95, text: '거의 다 따뜻한 음료를 찾아요.' },
};

const FACES = ['🧑', '👩', '👨', '👧', '👦', '🧑‍💼', '👩‍🎓', '👨‍💻', '👵', '👴', '🧑‍🎨', '👩‍🔬', '🧔', '👱‍♀️'];
const SLOT_KEYS = ['Q', 'W', 'E', 'R', 'T'];

// ===== 상태 =====
function newState() {
    return {
        day: 1, money: 50000, rep: 30,
        stock: { shot: 20, milk: 10, syrup: 0, choco: 0, matcha: 0, cake: 0 },
        unlocked: { vanilla: false, mocha: false, greentea: false, cake: false },
        up: { machine: 0, seats: 0, interior: 0 },
        priceLevel: 1, alba: false, flyer: false,
        weather: rollWeather(), won: false,
    };
}
function rollWeather() {
    const r = Math.random();
    return r < 0.4 ? 'sunny' : r < 0.6 ? 'hot' : r < 0.8 ? 'rain' : 'cold';
}
function load() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            const s = JSON.parse(raw);
            if (s && typeof s.day === 'number') return Object.assign(newState(), s);
        }
    } catch (e) { /* 저장소 사용 불가 */ }
    return newState();
}
function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ }
}

let S = load();
let G = null; // 영업 중 상태

// ===== 유틸 =====
const $ = id => document.getElementById(id);
const won = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const round100 = n => Math.round(n / 100) * 100;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function stars(rep) {
    const n = clamp(Math.round(rep / 20), 0, 5);
    return '★'.repeat(n) + '☆'.repeat(5 - n);
}
function toast(msg, cls = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + cls;
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 1800);
    while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
}
const ingAvailable = k => !INGS[k].need || S.unlocked[INGS[k].need];
const menuAvailable = k => !MENU[k].unlock || S.unlocked[k];
const rent = () => 15000 + 5000 * S.up.seats;

// ===== 사운드: 배경음악 + 효과음 (Web Audio로 직접 합성, 음원 파일 없음) =====
const Sound = (() => {
    const PREF_KEY = 'cafe-game-audio-v1';
    const MUSIC_VOL = 0.55;
    const pref = { music: true, sfx: true };
    try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch (e) { /* 기본값 */ }
    const savePref = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) { /* 무시 */ } };

    let ctx = null, master, musicBus, sfxBus, noiseBuf, musicTimer = null;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const rnd = (a, b) => a + Math.random() * (b - a);

    function init() {
        if (!ctx) {
            try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
            master = ctx.createGain(); master.gain.value = 0.9;
            const comp = ctx.createDynamicsCompressor();
            master.connect(comp); comp.connect(ctx.destination);
            musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOL;
            const warm = ctx.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 2800; // 로파이 느낌
            musicBus.connect(warm); warm.connect(master);
            sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
            noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (ctx.state === 'suspended') ctx.resume();
        if (pref.music) startMusic();
    }

    // --- 기본 음원 ---
    function tone(freq, t, dur, o = {}) {
        const { type = 'sine', vol = 0.15, attack = 0.005, glide = 0, dest = sfxBus, filter = 0 } = o;
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (glide) osc.frequency.exponentialRampToValueAtTime(glide, t + attack + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
        let out = osc;
        if (filter) {
            const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter;
            osc.connect(f); out = f;
        }
        out.connect(g); g.connect(dest);
        osc.start(t); osc.stop(t + attack + dur + 0.03);

    function noise(t, dur, o = {}) {
        const { type = 'bandpass', freq = 1000, q = 1, vol = 0.15, attack = 0.005, hold = 0, sweep = 0, dest = sfxBus } = o;
        const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
        f.frequency.setValueAtTime(freq, t);
        if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + attack + hold + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        if (hold) g.gain.setValueAtTime(vol, t + attack + hold);
        g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + dur);
        src.connect(f); f.connect(g); g.connect(dest);
        src.start(t, Math.random() * 1.5); src.stop(t + attack + hold + dur + 0.03);

    // --- 효과음 ---
    const SFX = {
        click: t => tone(880, t, 0.06, { vol: 0.07 }),

        upgrade: t => [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.07, 0.25, { type: 'triangle', vol: 0.08 })),

    const CHORDS = [ // [베이스, 코드 구성음...] (MIDI)
        [38, 53, 57, 60, 64], // Dm9
        [43, 53, 59, 64, 69], // G13
        [36, 52, 55, 59, 62], // Cmaj9
        [45, 55, 60, 64, 71], // Am9
        [41, 57, 60, 64, 67], // Fmaj9
        [40, 56, 62, 65, 68], // E7(b9)
        [45, 55, 60, 64, 67], // Am7
        [43, 53, 59, 62, 65], // G7
    ];
    const MELODY = [67, 69, 72, 74, 76, 79, 81, 84];
    const BPM = 76, STEP = 60 / BPM / 4;
    let step = 0, nextTime = 0, melIdx = 3;

    function ep(m, t, dur, vol) { // 일렉트릭 피아노
        tone(mtof(m), t, dur, { vol, attack: 0.01, dest: musicBus });
        tone(mtof(m) * 2, t, dur * 0.4, { type: 'triangle', vol: vol * 0.18, attack: 0.01, dest: musicBus });
    }
    function playStep(s, time) {
        const bar = Math.floor(s / 16), pos = s % 16;
        const t = time + (pos % 4 === 2 ? STEP * 0.3 : 0); // 스윙
        const ch = CHORDS[bar], nextRoot = CHORDS[(bar + 1) % CHORDS.length][0];
        if (pos === 0) ch.slice(1).forEach((m, i) => ep(m, t + i * 0.014, STEP * 15, 0.035));
        if (pos === 10 && Math.random() < 0.5) ch.slice(2, 4).forEach((m, i) => ep(m, t + i * 0.012, STEP * 5, 0.022));
        // 베이스
        if (pos === 0) tone(mtof(ch[0]), t, STEP * 6, { type: 'triangle', vol: 0.14, filter: 500, attack: 0.01, dest: musicBus });
        if (pos === 8) tone(mtof(ch[0] + 7), t, STEP * 4, { type: 'triangle', vol: 0.11, filter: 500, attack: 0.01, dest: musicBus });
        if (pos === 14 && Math.random() < 0.6) tone(mtof(nextRoot + (Math.random() < 0.5 ? -1 : 2)), t, STEP * 1.5, { type: 'triangle', vol: 0.09, filter: 500, dest: musicBus });
        // 드럼
        if (pos === 0 || pos === 10) tone(110, t, 0.22, { vol: 0.28, glide: 42, dest: musicBus });
        if (pos === 4 || pos === 12) { noise(t, 0.14, { freq: 1800, q: 0.8, vol: 0.05, dest: musicBus }); tone(190, t, 0.07, { vol: 0.025, dest: musicBus }); }
        if (pos % 2 === 0) noise(t, 0.035, { type: 'highpass', freq: 7000, vol: pos % 4 === 0 ? 0.035 : 0.022, dest: musicBus });
        // 비브라폰 멜로디
        if (pos % 2 === 0 && Math.random() < 0.2) {
            melIdx = Math.max(0, Math.min(MELODY.length - 1, melIdx + [-2, -1, 1, 2][Math.floor(Math.random() * 4)]));
            tone(mtof(MELODY[melIdx]), t, 0.9, { vol: 0.04, dest: musicBus });
            tone(mtof(MELODY[melIdx]) * 4, t, 0.2, { vol: 0.006, dest: musicBus });
        }
        // LP 잡음
        if (Math.random() < 0.1) noise(t + Math.random() * STEP, 0.01, { freq: 3000, q: 4, vol: 0.02, dest: musicBus });
    }
    function schedule() {
        if (!ctx) return;
        if (nextTime < ctx.currentTime) nextTime = ctx.currentTime + 0.05; // 탭이 잠들었다 깬 경우
        while (nextTime < ctx.currentTime + 0.3) {
            try { playStep(step, nextTime); } catch (e) { /* 무시 */ }
            nextTime += STEP;
            step = (step + 1) % (16 * CHORDS.length);
        }
    }
    function startMusic() {
        if (musicTimer || !ctx) return;
        step = 0; nextTime = ctx.currentTime + 0.1;
        musicBus.gain.cancelScheduledValues(ctx.currentTime);
        musicBus.gain.setValueAtTime(MUSIC_VOL, ctx.currentTime);
        musicTimer = setInterval(schedule, 60);
    }
    function stopMusic() {
        clearInterval(musicTimer); musicTimer = null;
        if (ctx) musicBus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
    }
    function duck(on) {
        if (ctx && musicTimer) musicBus.gain.setTargetAtTime(on ? MUSIC_VOL * 0.3 : MUSIC_VOL, ctx.currentTime, 0.2);
    }

    function renderButtons() {
        const m = $('musicBtn'), s = $('sfxBtn');
        m.textContent = pref.music ? '🎵 음악 켜짐' : '🎵 음악 꺼짐';
        s.textContent = pref.sfx ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
        m.classList.toggle('off', !pref.music);
        s.classList.toggle('off', !pref.sfx);
    }
    function toggleMusic() {
        pref.music = !pref.music; savePref();
        if (pref.music) { init(); startMusic(); } else stopMusic();
        renderButtons();
    }
    function toggleSfx() {
        pref.sfx = !pref.sfx; savePref();
        init(); renderButtons();
        play('click');
    }

    return { init, play, ingredient, duck, toggleMusic, toggleSfx, renderButtons };
})();

// ===== 매장 장면 (캔버스 애니메이션) =====
const Scene = (() => {
    const W = 720, H = 330;

    const SHIRTS = ['#e76f51', '#2a9d8f', '#457b9d', '#f4a261', '#8e7dbe', '#e9c46a', '#6c757d', '#d62828', '#43aa8b', '#f28482'];

    const lerp = (a, b, k) => a + (b - a) * k;

                 apron, hat, arm: 0, phase: 0, pending: null, moving: false, worker: true, alpha: 1 };

        for (const f of flying) {
            f.k += dt / 0.45;
            if (f.k >= 1) {
                f.p.hold = f.drink;
                f.p.mood = 'happy';
                f.p.bubble = { text: '💕', until: t + 1.3 };
                goNext(f.p);
            }
        }
        flying = flying.filter(f => f.k < 1);

        for (const q of particles) {
            q.life -= dt;
            q.x += q.vx * dt; q.y += q.vy * dt;
            if (q.type === 'cube' || q.g) q.vy += (q.g || 400) * dt;
            if (q.type === 'steam') q.r += dt * 6;
        }
        particles = particles.filter(q => q.life > 0);
        if (particles.length > 300) particles.splice(0, particles.length - 300);

        const near = people.some(p => Math.hypot(p.x - DOORX, p.y - FLOOR_Y) < 36);
        door += ((near ? 1 : 0) - door) * Math.min(1, dt * 10);

        if (G && G.brewing && Math.random() < dt * 10) puff(MACHINE_X + rnd(-12, 4), CTOP - 58);

        // 창밖 행인
        if (Math.random() < dt * 0.25 && walkers.length < 3) {
            const dir = Math.random() < 0.5 ? 1 : -1;
            walkers.push({ x: dir > 0 ? 118 : 302, dir, speed: rnd(14, 26), color: pick(SHIRTS), umbrella: S.weather === 'rain' ? pick(['#e63946', '#1d3557', '#ffb703', '#2a9d8f']) : null });
        }
        for (const w of walkers) w.x += w.dir * w.speed * dt;
        walkers = walkers.filter(w => w.x > 100 && w.x < 320);
    }

    function skyColors(frac) {
        const w = S.weather;
        const stops = [[0, '#9fd3f0'], [0.45, '#79bff5'], [0.72, '#f6b27a'], [0.86, '#8a6fb0'], [1, '#27304f']];
        let a = stops[0], b = stops[stops.length - 1];
        for (let i = 0; i < stops.length - 1; i++) if (frac >= stops[i][0] && frac <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
        let col = mix(a[1], b[1], (frac - a[0]) / ((b[0] - a[0]) || 1));
        const tint = w === 'rain' ? ['#7f8c99', 0.55] : w === 'cold' ? ['#dfe7ef', 0.4] : w === 'hot' ? ['#ffb86b', 0.25] : null;
        if (tint) {
            const m = col.match(/\d+/g).map(Number);
            const hex = '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
            col = mix(hex, tint[0], tint[1]);
        }
        return col;
    }

        // 구름
        const cloudCol = wt === 'rain' ? 'rgba(90,100,115,0.85)' : 'rgba(255,255,255,0.85)';
        for (let i = 0; i < (wt === 'rain' ? 4 : 2); i++) {

            c.fillStyle = '#3d3d3d'; c.fillRect(px - 3, py - 8, 2, 8); c.fillRect(px + 1, py - 8, 2, 8);

                c.strokeStyle = '#333'; c.beginPath(); c.moveTo(px, py - 32 + bob); c.lineTo(px, py - 18 + bob); c.stroke();

        }

        }
        c.restore();
        // 창틀
        c.strokeStyle = '#6b4a33'; c.lineWidth = 6; rr(x, y, w, h, 6); c.stroke();
        c.lineWidth = 3; c.beginPath(); c.moveTo(x + w / 2, y); c.lineTo(x + w / 2, y + h); c.moveTo(x, y + h / 2 - 8); c.lineTo(x + w, y + h / 2 - 8); c.stroke();
        c.lineWidth = 1;

        if (S.up.interior >= 1) { drawPot(x + 20, y + h + 2, 0.6); drawPot(x + w - 22, y + h + 2, 0.55); }

    function drawClock(frac) {
        const cx = 334, cy = 48, r = 17;
        c.fillStyle = '#fffaf0'; ell(cx, cy, r, r); c.fill();
        c.strokeStyle = '#5b3a29'; c.lineWidth = 3; c.stroke(); c.lineWidth = 1;

        c.fillStyle = G && G.brewing ? '#ff6b6b' : '#51cf66'; ell(mx - 18, CTOP - 44, 3, 3); c.fill();
        c.fillStyle = '#495057'; c.fillRect(mx - 20, CTOP - 8, 40, 4);
        if (G && G.brewing) {
            const total = UPGRADES.machine.vals[S.up.machine], k = 1 - G.brewing.left / total;
            c.strokeStyle = '#4a2a18'; c.lineWidth = 2;
            c.beginPath(); c.moveTo(mx, CTOP - 22); c.lineTo(mx, CTOP - 10); c.stroke(); c.lineWidth = 1;
            c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillRect(mx - 5, CTOP - 17, 10, 9);
            c.fillStyle = '#4a2a18'; c.fillRect(mx - 5, CTOP - 8 - 9 * k, 10, 9 * k);
        }
        c.restore();
        drawWorkingCup();
    }

    function drawTable(tb) {
        const { x, y } = tb;
        const top = S.up.interior >= 1 ? '#6f4e37' : '#8d6748';
        c.fillStyle = 'rgba(0,0,0,0.12)'; ell(x, y + 1, 22, 5); c.fill();
        c.fillStyle = '#4a3326'; c.fillRect(x - 2, y - 26, 4, 26); c.fillRect(x - 10, y - 2, 20, 3);
        c.fillStyle = top; ell(x, y - 28, 26, 8); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.12)'; ell(x - 4, y - 30, 16, 3); c.fill();
        // 빈 의자
        if (!tb.who || tb.who.state !== 'seated') drawChair(x - 28, y);
        if (tb.who && tb.who.state === 'seated' && tb.who.hold) {
            const d = tb.who.hold;
            drawCupShape(x - 8, y - 31, 0.75, d.color, d.iced, !d.iced);
            if (d.cake) drawCake(x + 10, y - 30, 0.8);
        }
    }
    function drawChair(x, y) {
        c.fillStyle = '#5b3a29';
        c.fillRect(x - 12, y - 16, 24, 4);
        c.fillRect(x - 11, y - 12, 3, 12); c.fillRect(x + 8, y - 12, 3, 12);
        c.fillRect(x - 13, y - 40, 4, 28);
    }

    function drawPerson(p) {
        const L = p.look, s = L.h;
        const seated = p.seated && p.state === 'seated';
        const walking = p.worker ? p.moving : p.path.length > 0;
        const sw = walking ? Math.sin(p.phase) : 0;
        const bob = walking ? Math.abs(Math.sin(p.phase)) * 1.5 : 0;
        const shakeX = p.shake > 0 ? Math.sin(t * 60) * 2 : 0;
        c.save();
        c.translate(p.x + shakeX, p.y);
        c.globalAlpha = p.alpha ?? 1;
        if (seated) drawChair(0, 0);
        c.scale(s, s);
        if (!p.worker) { c.fillStyle = 'rgba(0,0,0,0.15)'; ell(0, 0, 15, 4); c.fill(); }
        const dy = seated ? 12 : -bob;
        // 다리
        c.fillStyle = L.pants;
        if (seated) {
            rr(-6, -18, 20, 7, 3); c.fill();
            rr(9, -16, 6, 16, 3); c.fill();
            c.fillStyle = '#222'; rr(8, -3, 10, 4, 2); c.fill();
        } else {
            rr(-9 + sw * 3, -24, 8, 24, 3); c.fill();
            rr(1 - sw * 3, -24, 8, 24, 3); c.fill();
            c.fillStyle = '#222'; rr(-10 + sw * 3, -4, 10, 4, 2); c.fill(); rr(0 - sw * 3, -4, 10, 4, 2); c.fill();
        }
        // 몸
        c.fillStyle = L.shirt; rr(-14, -60 + dy, 28, 38, 9); c.fill();
        if (p.apron) {
            c.fillStyle = p.apron; rr(-10, -50 + dy, 20, 30, 4); c.fill();
            c.strokeStyle = p.apron; c.lineWidth = 2; c.beginPath(); c.moveTo(-6, -50 + dy); c.lineTo(-4, -60 + dy); c.moveTo(6, -50 + dy); c.lineTo(4, -60 + dy); c.stroke(); c.lineWidth = 1;
        }
        // 팔
        c.fillStyle = L.shirt;
        const armSwing = walking ? sw * 4 : 0;
        rr(-19, -56 + dy + armSwing, 7, 24, 3); c.fill();
        if (p.arm > 0) {
            c.save(); c.translate(15, -54 + dy); c.rotate(-1.2); rr(-3, 0, 7, 22, 3); c.fill();
            c.fillStyle = L.skin; ell(0, 23, 4, 4); c.fill(); c.restore();
        } else {
            rr(12, -56 + dy - armSwing, 7, 24, 3); c.fill();
            c.fillStyle = L.skin; ell(15.5, -31 + dy - armSwing, 4, 4); c.fill();
        }
        c.fillStyle = L.skin; ell(-15.5, -31 + dy + armSwing, 4, 4); c.fill();
        if (p.hold && !seated) {
            drawCupShape(17, -30 + dy, 0.7, p.hold.color, p.hold.iced, !p.hold.iced);
            if (p.hold.cake) drawCake(-17, -30 + dy, 0.7);
        }
        // 머리
        const hy = -72 + dy;
        c.fillStyle = L.skin; ell(0, hy, 13, 13); c.fill();
        c.fillStyle = L.hair;
        if (p.worker) {
            c.fillStyle = p.hat; c.beginPath(); c.arc(0, hy - 3, 13.5, Math.PI, 0); c.fill();
            c.fillRect(0, hy - 5, 18, 4);
        } else if (L.style === 0) {
            c.beginPath(); c.arc(0, hy - 2, 14, Math.PI, 0); c.fill();
        } else if (L.style === 1) {
            c.beginPath(); c.arc(0, hy - 2, 14.5, Math.PI, 0); c.fill();
            rr(-15, hy - 3, 6, 22, 3); c.fill(); rr(9, hy - 3, 6, 22, 3); c.fill();
        } else if (L.style === 2) {
            c.beginPath(); c.arc(0, hy - 2, 14, Math.PI, 0); c.fill();
            ell(0, hy - 16, 6, 6); c.fill();
        } else {
            c.beginPath(); c.arc(0, hy - 4, 13, Math.PI * 1.1, Math.PI * 1.9); c.fill();
            c.fillStyle = 'rgba(40,40,40,0.8)'; c.fillRect(-8, hy - 2, 7, 3); c.fillRect(1, hy - 2, 7, 3);
        }
        // 얼굴
        const mood = p.worker ? 'happy' : p.mood;
        c.fillStyle = mood === 'angry' ? 'rgba(229,62,62,0.25)' : 'rgba(255,120,120,0.25)';
        ell(-8, hy + 4, 3, 2); c.fill(); ell(8, hy + 4, 3, 2); c.fill();
        c.fillStyle = '#222';
        ell(-4.5, hy + 1, 1.6, 1.8); c.fill(); ell(4.5, hy + 1, 1.6, 1.8); c.fill();
        c.strokeStyle = '#222'; c.lineWidth = 1.3; c.beginPath();
        if (mood === 'happy') c.arc(0, hy + 4, 4, 0.15 * Math.PI, 0.85 * Math.PI);
        else if (mood === 'ok') { c.moveTo(-3, hy + 7); c.lineTo(3, hy + 7); }
        else c.arc(0, hy + 10, 4, 1.2 * Math.PI, 1.8 * Math.PI);
        c.stroke();
        if (mood === 'angry' || mood === 'sad') {
            c.beginPath(); c.moveTo(-7, hy - 5); c.lineTo(-2, hy - 3); c.moveTo(7, hy - 5); c.lineTo(2, hy - 3); c.stroke();
        }
        if (mood === 'sad') { c.fillStyle = '#74c0fc'; ell(11, hy - 4, 2, 3); c.fill(); }
        c.lineWidth = 1;
        c.restore();
    }

    function headTop(p) { return p.y - (p.seated ? 74 : 86) * p.look.h; }
    function drawBubble(p) {
        if (p.alpha < 0.5) return;
        const hx = p.x, hy = headTop(p);
        if (p.bubble && t < p.bubble.until) {
            c.font = '18px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
            c.fillText(p.bubble.text, hx + 12, hy + 2);
            return;
        }
        if (!(p.state === 'enter' || p.state === 'wait') || !p.gc) return;
        const o = p.gc.order;
        const bw = o.cake ? 52 : 40, bx = hx - bw / 2, by = hy - 38;
        c.fillStyle = '#fff'; c.strokeStyle = 'rgba(0,0,0,0.15)';
        rr(bx, by, bw, 30, 8); c.fill(); c.stroke();
        c.beginPath(); c.moveTo(hx - 5, by + 30); c.lineTo(hx, by + 37); c.lineTo(hx + 5, by + 30); c.fill();
        drawCupShape(o.cake ? hx - 10 : hx - 2, by + 26, 0.9, DRINK_COLOR[o.key], !!o.req.ice, !o.req.ice);
        if (o.req.shot === 2) { c.fillStyle = '#4a2a18'; c.font = 'bold 9px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('+1', (o.cake ? hx - 3 : hx + 5), by + 3); }
        if (o.cake) drawCake(hx + 13, by + 25, 0.9);
        c.fillStyle = '#a0aec0'; c.font = 'bold 9px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
        c.fillText(SLOT_KEYS[p.slot] || '', bx + 4, by + 3);
        // 인내심 바
        const r = Math.max(0, p.gc.patience / p.gc.maxPatience);
        c.fillStyle = '#edf2f7'; rr(bx + 4, by + 31, bw - 8, 3, 1.5); c.fill();
        c.fillStyle = r > 0.5 ? '#48bb78' : r > 0.25 ? '#ed8936' : '#e53e3e';
        rr(bx + 4, by + 31, (bw - 8) * r, 3, 1.5); c.fill();
    }

    function drawParticles() {
        for (const q of particles) {
            const a = Math.max(0, q.life / q.max);
            if (q.type === 'steam') { c.fillStyle = `rgba(255,255,255,${0.55 * a})`; ell(q.x, q.y, q.r, q.r); c.fill(); }
            else if (q.type === 'drop') { c.fillStyle = q.color; c.globalAlpha = a; ell(q.x, q.y, q.r, q.r * 1.4); c.fill(); c.globalAlpha = 1; }
            else if (q.type === 'cube') { c.fillStyle = q.color; c.strokeStyle = '#a5d8ff'; c.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2); c.strokeRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2); }
            else if (q.type === 'spark') { c.fillStyle = `rgba(255,215,0,${a})`; c.font = '10px sans-serif'; c.textAlign = 'center'; c.fillText('✦', q.x, q.y); }
            else if (q.type === 'text') {
                c.globalAlpha = Math.min(1, a * 1.5);
                c.font = 'bold 13px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
                c.lineWidth = 3; c.strokeStyle = '#fff'; c.strokeText(q.text, q.x, q.y);
                c.fillStyle = q.color; c.fillText(q.text, q.x, q.y);
                c.globalAlpha = 1; c.lineWidth = 1;
            }
        }
    }
    function drawNight(frac) {
        const k = Math.max(0, (frac - 0.7) / 0.3);
        if (k <= 0) return;
        c.fillStyle = `rgba(20,24,60,${0.28 * k})`; c.fillRect(0, 0, W, H);
        c.save(); c.globalCompositeOperation = 'lighter';
        const lamps = S.up.interior >= 1 ? [[440, 146], [560, 146], [660, 146]] : [[200, 10], [520, 10]];
        for (const [x, y] of lamps) {
            const g = c.createRadialGradient(x, y, 2, x, y + 60, 150);
            g.addColorStop(0, `rgba(255,200,120,${0.35 * k})`); g.addColorStop(1, 'rgba(255,200,120,0)');
            c.fillStyle = g; c.fillRect(x - 160, y - 20, 320, 260);
        }
        c.restore();
    }

    function draw() {
        fit();
        const frac = dayFrac();
        c.clearRect(0, 0, W, H);
        drawWall(frac);
        drawFloor();
        const list = [{ y: WORKER_Y, f: () => drawPerson(barista) }, { y: CBOT, f: drawCounter }];
        if (S.alba) list.push({ y: WORKER_Y - 1, f: () => drawPerson(alba) });
        for (const tb of tables) list.push({ y: tb.y, f: () => drawTable(tb) });
        for (const p of people) list.push({ y: p.seated ? p.y - 1 : p.y, f: () => drawPerson(p) });
        if (S.up.interior >= 1) list.push({ y: FLOOR_Y + 40, f: () => drawPot(318, FLOOR_Y + 40, 1) });
        if (S.up.interior >= 2) list.push({ y: FLOOR_Y + 20, f: () => drawPot(98, FLOOR_Y + 20, 0.8) });
        list.sort((a, b) => a.y - b.y).forEach(o => o.f());
        for (const f of flying) {
            const tx = f.p.x + 17, ty = f.p.y - 30;
            const x = lerp(f.x0, tx, f.k), y = lerp(f.y0, ty, f.k) - Math.sin(f.k * Math.PI) * 40;
            drawCupShape(x, y, 0.8, f.drink.color, f.drink.iced, false);
        }
        drawParticles();
        for (const p of people) drawBubble(p);
        drawNight(frac);
        if (G && G.paused) {
            c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(0, 0, W, H);
            c.fillStyle = '#fff'; c.font = 'bold 28px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillText('⏸ 일시정지', W / 2, H / 2);
        }
    }

    function hit(clientX, clientY) {
        const r = cvs.getBoundingClientRect();
        const x = (clientX - r.left) * W / r.width, y = (clientY - r.top) * H / r.height;
        let best = -1, bestD = 1e9;
        for (const p of people) {
            if (!(p.state === 'enter' || p.state === 'wait') || p.slot < 0) continue;
            if (Math.abs(x - p.x) < 28 && y > headTop(p) - 42 && y < p.y + 6) {
                const d = Math.abs(x - p.x);
                if (d < bestD) { bestD = d; best = p.slot; }
            }
        }
        return best;
    }

    return { reset, syncTables, addCustomer, ingredient, brewDone, trash, serve, wrong, angry, closing, update, draw, hit };
})();

    menuItems.push(S.unlocked.cake
        ? `<div class="item done"><div class="t">🍰 ${CAKE.name}</div><div class="d">음료와 함께 주문돼요<br>판매가 ${won(CAKE.price)}</div><button disabled>✅ 판매 중</button></div>`
        : `<div class="item"><div class="t">🍰 ${CAKE.name}</div><div class="d">음료와 함께 주문돼요<br>판매가 ${won(CAKE.price)}</div>
           <button data-unlock="cake" ${S.money < CAKE.unlock ? 'disabled' : ''}>들여놓기 ${won(CAKE.unlock)}</button></div>`);
    $('shopMenu').innerHTML = menuItems.join('');

    // 업그레이드
    $('shopUpg').innerHTML = Object.keys(UPGRADES).map(k => {
        const u = UPGRADES[k], lv = S.up[k];

            <div class="t">${u.icon} ${u.name} Lv.${lv + 1}</div>
            <div class="d">현재: ${u.desc(u.vals[lv])}${max ? '' : `<br>다음: ${u.desc(u.vals[lv + 1])}`}</div>
            ${max ? '<button disabled>최고 레벨</button>'
                  : `<button data-upg="${k}" ${S.money < u.costs[lv] ? 'disabled' : ''}>업그레이드 ${won(u.costs[lv])}</button>`}
        </div>`;
    }).join('');

    // 가격
    $('priceSeg').innerHTML = PRICE_LEVELS.map((p, i) =>
        `<button data-price="${i}" class="${S.priceLevel === i ? 'on' : ''}">${p.name}</button>`).join('') +
        `<span style="font-size:12px;color:#718096;align-self:center">싸면 손님이 늘고, 비싸면 줄어요.</span>`;

    // 일일 옵션
    $('dailyOpts').innerHTML = `

            <button data-opt="alba">${S.alba ? '고용 중 ✓' : '고용하기'}</button>
        </div>
        <div class="toggle ${S.flyer ? 'on' : ''}">
            <span>📣 <b>전단지 돌리기</b> — 오늘 손님 +40% (${won(FLYER_COST)}, 즉시 지불)</span>
            <button data-opt="flyer" ${S.flyer || S.money < FLYER_COST ? 'disabled' : ''}>${S.flyer ? '배포 완료 ✓' : '돌리기'}</button>
        </div>`;
}

$('prep').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.buy) {
        const p = PACKS[d.buy];
        if (S.money >= p.cost) { S.money -= p.cost; S.stock[d.buy] += p.qty; Sound.play('buy'); }
    } else if (d.unlock) {
        const cost = d.unlock === 'cake' ? CAKE.unlock : MENU[d.unlock].unlock;
        if (S.money >= cost) {
            S.money -= cost; S.unlocked[d.unlock] = true;
            const ingKey = Object.keys(INGS).find(i => INGS[i].need === d.unlock);
            if (ingKey) S.stock[ingKey] += PACKS[ingKey].qty; // 개발 기념 재료 1묶음 증정
            toast('새 메뉴 등록! 재료 1묶음 증정 🎁', 'good'); Sound.play('upgrade');
        }
    } else if (d.upg) {
        const cost = UPGRADES[d.upg].costs[S.up[d.upg]];
        if (S.money >= cost) { S.money -= cost; S.up[d.upg]++; toast(UPGRADES[d.upg].name + ' 업그레이드 완료!', 'good'); Sound.play('upgrade'); }
    } else if (d.price !== undefined) {
        S.priceLevel = Number(d.price); Sound.play('click');
    } else if (d.opt === 'alba') {
        S.alba = !S.alba; Sound.play('click');
    } else if (d.opt === 'flyer') {
        if (S.money >= FLYER_COST) { S.money -= FLYER_COST; S.flyer = true; Sound.play('buy'); }
    }
    save();
    renderPrep();
});

$('resetBtn').addEventListener('click', () => {
    if (!confirm('정말 처음부터 다시 시작할까요? 진행 상황이 사라집니다.')) return;
    S = newState(); save(); renderPrep();
});
$('openBtn').addEventListener('click', startDay);

// ===== 영업 =====
function startDay() {
    const slots = UPGRADES.seats.vals[S.up.seats];
    G = {
        t: 0, paused: false, over: false,
        slots: new Array(slots).fill(null),
        cup: {}, brewing: null,
        nextSpawn: 1.5, albaTimer: 6,
        revenue: 0, tips: 0, served: 0, missed: 0, wrong: 0, walked: 0,
        repStart: S.rep, stockStart: { ...S.stock },
    };
    Scene.reset();
    $('prep').hidden = true;
    $('play').hidden = false;
    $('pauseBtn').textContent = '⏸️ 일시정지';
    buildIngs();
    buildCounter();
    renderCup();
    renderRecipes();
    renderStats();
    Sound.play('open');
    $('scene').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildIngs() {
    const keys = ING_ORDER.filter(ingAvailable);
    $('ings').innerHTML = keys.map((k, i) => `
        <button class="ing" data-ing="${k}">
            <span class="kb">${i + 1}</span>
            <span class="ic">${INGS[k].icon}</span>
            <span class="nm">${INGS[k].name}</span>
            <span class="cnt" id="cnt-${k}"></span>
            ${k === 'shot' ? '<span class="brew" id="brewBar"></span>' : ''}
        </button>`).join('');
    G.ingKeys = keys;
    updateIngCounts();
}
function updateIngCounts() {
    for (const k of G.ingKeys) {
        const el = $('cnt-' + k);
        const btn = el.parentElement;
        if (INGS[k].stock) {
            el.textContent = '재고 ' + S.stock[k];
            btn.disabled = S.stock[k] <= 0 || (k === 'shot' && !!G.brewing);
        } else {
            el.textContent = '무제한';
        }
    }
}

function buildCounter() {
    $('counter').style.gridTemplateColumns = window.innerWidth <= 560 ? '' : `repeat(${G.slots.length}, 1fr)`;
    $('counter').innerHTML = G.slots.map((_, i) => `<div class="slot" id="slot-${i}" data-slot="${i}"></div>`).join('');
}

function renderRecipes() {
    const lines = Object.keys(MENU).filter(menuAvailable).map(k => {
        const m = MENU[k];
        return `<b>${m.name}</b> = ${Object.keys(m.base).map(i => INGS[i].icon + INGS[i].name).join(' + ')}`;
    });
    lines.push('<b>아이스</b> 음료는 🧊얼음 추가 · <b>샷추가</b>는 ☕ 한 번 더');
    if (S.unlocked.cake) lines.push('<b>+🍰</b> 주문은 케이크도 함께 담아 서빙');
    $('recipeList').innerHTML = lines.join('<br>');
}

function makeOrder() {
    const w = WEATHERS[S.weather];
    const keys = Object.keys(MENU).filter(menuAvailable);
    const k = keys[Math.floor(Math.random() * keys.length)];
    const m = MENU[k];
    const iced = Math.random() < w.ice;
    const extra = m.coffee && Math.random() < 0.15;
    const cake = S.unlocked.cake && Math.random() < 0.25;
    const req = { ...m.base };
    if (iced) req.ice = 1;
    if (extra) req.shot = 2;
    if (cake) req.cake = 1;
    let price = m.price + (iced ? 500 : 0) + (extra ? 500 : 0);
    price = round100(price * PRICE_LEVELS[S.priceLevel].mul);
    const cakePrice = cake ? round100(CAKE.price * PRICE_LEVELS[S.priceLevel].mul) : 0;
    const label = (iced ? '아이스 ' : '따뜻한 ') + m.name + (extra ? ' (샷추가)' : '');
    return { key: k, req, price: price + cakePrice, label, cake };
}

function spawnCustomer() {
    const idx = G.slots.findIndex(s => s === null);
    if (idx < 0) { G.walked++; return; }
    const patience = (22 + Math.random() * 8) * UPGRADES.interior.vals[S.up.interior] * (0.8 + S.rep / 250);
    const order = makeOrder();
    G.slots[idx] = {
        face: FACES[Math.floor(Math.random() * FACES.length)],
        order, patience, maxPatience: patience,
    };
    drawCustomer(idx);
    Scene.addCustomer(idx, G.slots[idx]);
    Sound.play('bell');
}

function drawCustomer(i) {
    const c = G.slots[i];
    const slot = $('slot-' + i);
    if (!c) { slot.className = 'slot'; slot.innerHTML = ''; return; }
    slot.className = 'cust';
    slot.innerHTML = `
        <span class="key">${SLOT_KEYS[i]}</span>
        <div class="face">${c.face}</div>
        <div class="order">${c.order.label}${c.order.cake ? '<br>+ 🍰케이크' : ''}</div>
        <div class="price">${won(c.order.price)}</div>
        <div class="pbar"><div id="pb-${i}"></div></div>`;
}

function spawnRate() {
    return (0.14 + S.rep * 0.0022)
        * PRICE_LEVELS[S.priceLevel].traffic
        * WEATHERS[S.weather].traffic
        * (S.flyer ? 1.4 : 1);
}

// 화면 루프: 영업 중이면 게임 시간을 진행하고, 항상 매장 장면을 그림
let lastFrame = performance.now();
function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    try {
        if (G && !G.over && !G.paused) tick(dt);
        if (!G || !G.paused) Scene.update(dt);
        Scene.draw();
    } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
}

function tick(dt) {
    G.t += dt;

    // 시계
    const frac = clamp(G.t / DAY_LEN, 0, 1);
    $('timeFill').style.width = (frac * 100) + '%';
    const mins = 9 * 60 + Math.floor(frac * 12 * 60);
    $('clockNow').textContent = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');

    // 손님 등장
    if (G.t < DAY_LEN - 4) {
        G.nextSpawn -= dt;
        if (G.nextSpawn <= 0) {
            spawnCustomer();
            G.nextSpawn = -Math.log(1 - Math.random()) / spawnRate();
            G.nextSpawn = clamp(G.nextSpawn, 1.2, 14);
        }
    }

    // 샷 추출
    if (G.brewing) {
        G.brewing.left -= dt;
        const total = UPGRADES.machine.vals[S.up.machine];
        const bar = $('brewBar');
        if (bar) bar.style.width = ((1 - G.brewing.left / total) * 100) + '%';
        if (G.brewing.left <= 0) {
            G.brewing = null;
            if (bar) bar.style.width = '0';
            G.cup.shot = (G.cup.shot || 0) + 1;
            Sound.play('brewDone');
            Scene.brewDone();
            renderCup();
            updateIngCounts();
        }
    }

    // 인내심
    G.slots.forEach((c, i) => {
        if (!c) return;
        c.patience -= dt;
        const r = c.patience / c.maxPatience;
        const pb = $('pb-' + i);
        if (pb) {
            pb.style.width = clamp(r * 100, 0, 100) + '%';
            pb.style.background = r > 0.5 ? '#48bb78' : r > 0.25 ? '#ed8936' : '#e53e3e';
        }
        const slot = $('slot-' + i);
        slot.classList.toggle('warn', r <= 0.5 && r > 0.25);
        slot.classList.toggle('danger', r <= 0.25);
        if (c.patience <= 0) {
            G.slots[i] = null;
            G.missed++;
            S.rep = clamp(S.rep - 4, 0, 100);
            toast(c.face + ' 너무 오래 기다렸어요… 😠 평판 -4', 'bad');
            Sound.play('angry');
            Scene.angry(i);
            drawCustomer(i);
            renderStats();
        }
    });

    // 알바생
    if (S.alba) {
        G.albaTimer -= dt;
        if (G.albaTimer <= 0) {
            G.albaTimer = 7;
            albaServe();
        }
    }

    if (G.t >= DAY_LEN) endDay();
}

function albaServe() {
    // 가장 오래 기다린(인내심 비율이 낮은) 손님 중 재고로 만들 수 있는 주문을 처리
    const order = G.slots.map((c, i) => ({ c, i })).filter(x => x.c)
        .sort((a, b) => a.c.patience / a.c.maxPatience - b.c.patience / b.c.maxPatience);
    for (const { c, i } of order) {
        const ok = Object.entries(c.order.req).every(([k, n]) => !INGS[k].stock || S.stock[k] >= n);
        if (!ok) continue;
        for (const [k, n] of Object.entries(c.order.req)) if (INGS[k].stock) S.stock[k] -= n;
        G.revenue += c.order.price;
        S.money += c.order.price;
        G.served++;
        S.rep = clamp(S.rep + 1, 0, 100);
        G.slots[i] = null;
        Scene.serve(i, true, c.order.price, 0);
        Sound.play('register');
        drawCustomer(i);
        toast('🧑‍🍳 알바생이 ' + c.order.label + ' 서빙!');
        updateIngCounts();
        renderStats();
        return;
    }
}

function addIng(k) {
    if (!G || G.paused || G.over || !G.ingKeys.includes(k)) return;
    if (INGS[k].stock && S.stock[k] <= 0) { toast(INGS[k].name + ' 재고가 없어요!', 'bad'); return; }
    if (k === 'shot') {
        if (G.brewing) return;
        S.stock.shot--;
        G.brewing = { left: UPGRADES.machine.vals[S.up.machine] };
        Sound.ingredient('shot', G.brewing.left);
        Scene.ingredient('shot');
        updateIngCounts();
        return;
    }
    if (INGS[k].stock) S.stock[k]--;
    G.cup[k] = (G.cup[k] || 0) + 1;
    Sound.ingredient(k);
    Scene.ingredient(k);
    renderCup();
    updateIngCounts();
}

function trashCup() {
    if (!G || G.paused || G.over) return;
    if (!Object.keys(G.cup).length) return;
    G.cup = {};
    renderCup();
    Sound.play('trash');
    Scene.trash();
}

function cupMatches(req) {
    const keys = new Set([...Object.keys(req), ...Object.keys(G.cup)]);
    for (const k of keys) if ((req[k] || 0) !== (G.cup[k] || 0)) return false;
    return true;
}

function renderCup() {
    const keys = ING_ORDER.filter(k => G.cup[k]);
    $('cupContents').innerHTML = keys.length
        ? keys.map(k => `<span class="chip">${INGS[k].icon} ${INGS[k].name}${G.cup[k] > 1 ? ' x' + G.cup[k] : ''}</span>`).join('')
        : '<span class="empty">비어 있어요. 재료를 눌러 담아보세요.</span>';
    // 어떤 손님 주문과 일치하는지 안내
    const hit = G.slots.findIndex(c => c && cupMatches(c.order.req));
    $('cupGuess').textContent = hit >= 0 ? `✔ ${SLOT_KEYS[hit]} 손님 주문과 일치!` : '';
}

function serve(i) {
    if (!G || G.paused || G.over) return;
    const c = G.slots[i];
    if (!c) return;
    if (!Object.keys(G.cup).length && !G.brewing) { toast('컵이 비어 있어요!'); return; }
    if (G.brewing) { toast('샷 추출이 끝날 때까지 기다려요 ☕'); return; }
    if (cupMatches(c.order.req)) {
        const r = c.patience / c.maxPatience;
        const tip = r > 0.6 ? round100(c.order.price * 0.3 * r) : 0;
        const repGain = r > 0.6 ? 3 : r > 0.25 ? 1 : 0;
        G.revenue += c.order.price;
        G.tips += tip;
        S.money += c.order.price + tip;
        S.rep = clamp(S.rep + repGain, 0, 100);
        G.served++;
        toast(`${c.face} 감사합니다! +${won(c.order.price)}${tip ? ` (팁 ${won(tip)})` : ''}`, 'good');
        Sound.play('register');
        if (tip) Sound.play('tip');
        Scene.serve(i, false, c.order.price, tip);
        G.slots[i] = null;
    } else {
        G.wrong++;
        S.rep = clamp(S.rep - 3, 0, 100);
        c.patience -= c.maxPatience * 0.3;
        toast(`${c.face} 이거 제가 시킨 거 아닌데요… 평판 -3`, 'bad');
        Sound.play('wrong');
        Scene.wrong(i);
        const slot = $('slot-' + i);
        slot.classList.add('bad');
        setTimeout(() => slot.classList.remove('bad'), 400);
    }
    G.cup = {};
    drawCustomer(i);
    renderCup();
    renderStats();
}

function togglePause() {
    if (!G || G.over) return;
    G.paused = !G.paused;
    $('pauseBtn').textContent = G.paused ? '▶️ 계속하기' : '⏸️ 일시정지';
    Sound.duck(G.paused);
    Sound.play('pause');
    if (G.paused) toast('일시정지 — P를 눌러 계속');
}

$('ings').addEventListener('click', e => {
    const b = e.target.closest('[data-ing]');
    if (b && !b.disabled) addIng(b.dataset.ing);
});
$('counter').addEventListener('click', e => {
    const s = e.target.closest('[data-slot]');
    if (s) serve(Number(s.dataset.slot));
});
$('trashBtn').addEventListener('click', trashCup);
$('pauseBtn').addEventListener('click', togglePause);

$('scene').addEventListener('click', e => {
    if (!G || G.over) return;
    const slot = Scene.hit(e.clientX, e.clientY);
    if (slot >= 0) serve(slot);
});
$('musicBtn').addEventListener('click', () => Sound.toggleMusic());
$('sfxBtn').addEventListener('click', () => Sound.toggleSfx());
// 브라우저 정책상 소리는 첫 클릭/키 입력 이후에만 켤 수 있음
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sound.init()));

document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.toUpperCase() === 'M' && !(e.target instanceof HTMLInputElement)) { Sound.toggleMusic(); return; }
    if (!G || G.over) return;
    const key = e.key.toUpperCase();
    if (/^[1-8]$/.test(key)) {
        const k = G.ingKeys[Number(key) - 1];
        if (k) addIng(k);
    } else if (SLOT_KEYS.includes(key)) {
        const i = SLOT_KEYS.indexOf(key);
        if (i < G.slots.length) serve(i);
    } else if (key === 'X' || e.key === 'Backspace') {
        e.preventDefault();
        trashCup();
    } else if (key === 'P' || e.key === 'Escape') {
        togglePause();
    } else return;
});

// ===== 마감 =====
function endDay() {
    G.over = true;
    const leftover = G.slots.filter(Boolean).length;
    Scene.closing();
    const wage = S.alba ? ALBA_WAGE : 0;
    const r = rent();
    S.money -= r + wage;
    const repDelta = Math.round(S.rep - G.repStart);
    const used = Object.keys(S.stock).reduce((sum, k) => {
        const p = PACKS[k];
        return sum + Math.max(0, G.stockStart[k] - S.stock[k]) * (p.cost / p.qty);
    }, 0);
    const profit = G.revenue + G.tips - r - wage - used;

    const rows = [
        ['☕ 음료 매출', G.revenue, 'plus'],
        ['💝 팁', G.tips, 'plus'],
        ['🏠 임대료', -r, 'minus'],
    ];
    if (wage) rows.push(['🧑‍🍳 알바 일당', -wage, 'minus']);
    rows.push(['📦 사용한 재료 원가', -Math.round(used), 'minus']);

    let msg = `손님 ${G.served}명 서빙 · 놓친 손님 ${G.missed}명 · 잘못 서빙 ${G.wrong}회` +
        (G.walked ? `<br>자리가 없어 돌아간 손님 ${G.walked}명 (좌석 확장을 고려해보세요)` : '') +
        (leftover ? `<br>마감 시간이라 손님 ${leftover}명은 그냥 돌아갔어요.` : '') +
        `<br>평판 ${repDelta >= 0 ? '+' : ''}${repDelta} → ${stars(S.rep)}`;

    let title = `🌙 ${S.day}일차 마감`;
    let buttons = `<button class="primary" id="nextBtn">다음 날 준비하기 →</button>`;
    if (S.money < 0) {
        title = '💸 파산했어요…';
        msg += `<br><br><b>자금이 바닥났습니다.</b> ${S.day}일 동안 카페를 운영했어요.`;
        buttons = `<button class="primary" id="restartBtn">새 카페 차리기</button>`;
    } else if (!S.won && S.money >= GOAL) {
        S.won = true;
        title = '🎉 목표 달성!';
        msg += `<br><br><b>${S.day}일 만에 100만 원을 모았어요!</b> 동네 최고의 카페가 되었습니다. 계속 운영할 수도 있어요.`;
    }

    $('modal').innerHTML = `
        <h3>${title}</h3>
        <table class="report">
            ${rows.map(([n, v, c]) => `<tr><td>${n}</td><td class="${c}">${v >= 0 ? '+' : ''}${won(v)}</td></tr>`).join('')}
            <tr class="total"><td>오늘 순이익</td><td class="${profit >= 0 ? 'plus' : 'minus'}">${profit >= 0 ? '+' : ''}${won(profit)}</td></tr>
            <tr><td>현재 자금</td><td>${won(S.money)}</td></tr>
        </table>
        <p class="msg">${msg}</p>
        <div class="row">${buttons}</div>`;
    $('modalBg').hidden = false;
    renderStats();
    Sound.play('close');

    const next = $('nextBtn'), restart = $('restartBtn');
    if (next) {
        next.addEventListener('click', () => {
            S.day++; S.flyer = false;
            save(); closeDay();
        });
        next.focus();
    }
    if (restart) {
        restart.addEventListener('click', () => { S = newState(); save(); closeDay(); });
        restart.focus();
    }
    // 파산이 아니면 마감 직후 상태를 저장 (새로고침해도 이어하기)
    if (S.money >= 0) {
        const snapshot = { ...S, day: S.day + 1, flyer: false, weather: rollWeather() };
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot)); } catch (e) { /* 무시 */ }
        S.weather = snapshot.weather;
    } else {
        try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ }
    }
}

function closeDay() {
    $('modalBg').hidden = true;
    $('play').hidden = true;
    $('prep').hidden = false;
    G = null;
    renderPrep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('resize', () => {
    if (G && !G.over) $('counter').style.gridTemplateColumns = window.innerWidth <= 560 ? '' : `repeat(${G.slots.length}, 1fr)`;
});

Sound.renderButtons();
renderPrep();
requestAnimationFrame(frame);
</script>
</body>
</html>
